# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json

version: 1

reviews:
  enabled: true
  sensitivity: high
  incremental_commits: false
  check_drafts: false
  architecture_diagrams: false
  external_contributors_require_manual_review: true
  resolve_threads_when_addressed: false
  auto_approve_behavior: disabled
  auto_approve: disabled
  ultrareview: manual
  auto_ultrareview: disabled
  custom_instructions: |
    Prioritize observable correctness, security, lifecycle cleanup, concurrency,
    cross-platform behavior, and regressions that deterministic tests may miss.
    Enforce docs/architecture/design-principles.md. Prefer one owner for each
    state and lifecycle, validate only at trust boundaries, reuse shared
    contracts and schedulers, and reject fixes that append corrective stages
    instead of replacing the faulty behavior. Treat generated output and
    stylistic advice already covered by linting as low value.

pr_descriptions:
  generate: false
  cubic_review_link: false

issues:
  fix_with_cubic_buttons: false
  pr_comment_fixes: false
  fix_commits_to_pr: false
  auto_fix_sign_commits: false

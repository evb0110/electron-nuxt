name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * *'

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (non-mutating)
        run: pnpm run lint:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Architecture dependency graph
        run: node scripts/architecture/dep-graph.mjs --output=.tmp/architecture-dep-graph.json

      - name: Architecture boundary check (required)
        run: node scripts/architecture/boundary-check.mjs

      - name: Locale parity check
        run: pnpm run check:locales

      - name: Build (strict warnings)
        run: pnpm run build:strict

      - name: Test
        run: pnpm test

      - name: Resource matrix check
        run: pnpm run check:resources:matrix

      - name: Dead code check
        run: pnpm run knip

  electron-e2e:
    runs-on: ubuntu-latest
    needs:
      - quality
      - electron-e2e-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle native tools (Linux E2E)
        run: bash scripts/bundle-tools-linux.sh

      - name: Run Electron E2E tests
        run: xvfb-run -a --server-args="-screen 0 1440x900x24 -ac +extension RANDR" pnpm run test:e2e:electron

      - name: Upload Electron session logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-session-logs
          path: .devkit/sessions/**/session.log
          if-no-files-found: ignore

  electron-e2e-smoke:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle native tools (Linux E2E smoke)
        run: bash scripts/bundle-tools-linux.sh

      - name: Run Electron E2E smoke tests
        run: xvfb-run -a --server-args="-screen 0 1440x900x24 -ac +extension RANDR" pnpm run test:e2e:electron:smoke

      - name: Upload Electron smoke session logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-smoke-session-logs
          path: .devkit/sessions/**/session.log
          if-no-files-found: ignore

  landing-quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install landing dependencies
        run: pnpm install --frozen-lockfile
        working-directory: landing

      - name: Typecheck landing
        run: pnpm run typecheck
        working-directory: landing

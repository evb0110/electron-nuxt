name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  # Pin exact Node 24 patch level so CI does not drift independently of local verification.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EVB_E2E_PRESERVE_ARTIFACTS: '1'

jobs:
  commit_attribution:
    name: Commit Attribution Policy
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject prohibited attribution and local-only artifacts
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        # This widens to the pushed head's complete history when the before SHA is
        # absent or unreachable. That is the fail-closed force-push behavior; see
        # the publication-policy runbook in docs/releasing.md.
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/check-commit-attribution.mjs --pushed-range "$PR_BASE_SHA" "$PR_HEAD_SHA"
          else
            node scripts/check-commit-attribution.mjs --pushed-range "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"
          fi

  pr_quality:
    name: Quality Gates
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Install scan-cleanup audit tools
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Restore validation caches
        uses: actions/cache@v5
        with:
          path: |
            .devkit/cache/lint
            .devkit/cache/typecheck
          key: quality-${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', 'eslint-plugin-custom.mjs', 'landing/eslint.config.mjs', 'stylelint.config.mjs', 'tsconfig*.json', 'electron/tsconfig.json', 'landing/tsconfig.json', 'packages/*/tsconfig.json', 'scripts/tsconfig.json', 'server/tsconfig.json', 'tests/tsconfig.json') }}

      - name: Generate committed build artifacts and reject drift
        run: |
          pnpm run generate:build-artifacts
          pnpm run copy:pdfjs
          git diff --exit-code -- \
            app/assets/css/vendor/pdfjs-viewer-sanitized.css \
            app/platform/generated \
            native/evb-native-support/src/generated_native_tool_protocols.rs \
            public/pdfjs/images \
            scripts/release/generated-release-targets.cjs
          test -z "$(git ls-files --others --exclude-standard -- \
            app/assets/css/vendor/pdfjs-viewer-sanitized.css \
            app/platform/generated \
            native/evb-native-support/src/generated_native_tool_protocols.rs \
            public/pdfjs/images \
            scripts/release/generated-release-targets.cjs)"

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm run test:unit

      - name: Coverage zero-execution tripwire
        if: ${{ github.event_name == 'push' }}
        run: pnpm run test:coverage

  pr_electron_blocking_smoke:
    name: Electron Blocking Smoke
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.electron_smoke == 'true' }}
    needs: pr_changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: Electron blocking core-PDF smoke
        run: pnpm run test:e2e:electron:blocking-smoke:headless

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-blocking-smoke-${{ github.run_attempt }}

  pr_changed_areas:
    name: Changed Area Detection
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser_integration: ${{ steps.classify.outputs.browser_integration }}
      electron_smoke: ${{ steps.classify.outputs.electron_smoke }}
      landing: ${{ steps.classify.outputs.landing }}
      native_or_build: ${{ steps.classify.outputs.native_or_build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Classify changed areas from release policy
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$PUSH_HEAD_SHA"
            if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
              base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || printf '%s' "$head_sha")"
            fi
          fi
          node scripts/ci/classify-changed-areas.mjs --base="$base_sha" --head="$head_sha"

  pr_browser_integration:
    name: Browser Integration
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.browser_integration == 'true' }}
    needs: pr_changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser integration tests
        run: pnpm run test:integration:browser

  pr_native_build_safety:
    name: Native And Build Safety
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.native_or_build == 'true' }}
    needs: pr_changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Rust lint components
        run: rustup component add rustfmt clippy

      - name: Rust tests
        run: pnpm run test:rust

      - name: Rust formatting and clippy
        run: pnpm run lint:rust

      - name: Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: native/Cargo.toml

      - name: Strict build
        run: pnpm run build:strict

  pr_landing_quality:
    name: Landing Quality Gates For Changed Sources
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.landing == 'true' }}
    needs: pr_changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Landing lint
        run: pnpm --dir landing run lint

      - name: Landing typecheck
        run: pnpm --dir landing run typecheck

      - name: Landing build
        run: pnpm --dir landing run build

  manual_quality:
    name: Manual Quality Gates
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: WASM portable build
        run: pnpm run check:wasm:portable

      - name: Lint
        run: pnpm run lint:clean

      - name: Static reports
        run: pnpm run check:static:reports

      - name: Static assets
        run: pnpm run check:static:assets

      - name: Typecheck
        run: pnpm run typecheck:clean

      - name: Type coverage
        run: pnpm run typecheck:coverage

      - name: Strict build
        run: pnpm run build:strict:no-wasm-check

      - name: Fallow dead code
        run: pnpm run fallow

      - name: Fallow duplicates
        run: pnpm run fallow:dupes

      - name: Coverage
        run: pnpm run test:coverage

  manual_native:
    name: Native Rust Tests
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Install Rust lint components
        run: rustup component add rustfmt clippy

      - name: Rust tests
        run: pnpm run test:rust

      - name: Rust formatting and clippy
        run: pnpm run lint:rust

      - name: Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: native/Cargo.toml

  nightly_rust_fuzz:
    name: Native Parser Fuzz Canaries
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Fuzz image decoders
        run: |
          for target in png jpeg tiff netpbm; do
            cargo +nightly fuzz run "$target" --fuzz-dir native/pdf-image-combine/fuzz -- -max_total_time=15
          done

      - name: Fuzz xref parsers
        run: |
          for target in xref-table xref-stream; do
            cargo +nightly fuzz run "$target" --fuzz-dir native/pdf-page-ops/fuzz -- -max_total_time=15
          done

      - name: Fuzz JBIG2 codec
        run: |
          for target in decode roundtrip; do
            cargo +nightly fuzz run "$target" --fuzz-dir native/jbig2-codec/fuzz -- -max_total_time=15
          done

  manual_landing:
    name: Landing Quality Gates
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Landing lint
        run: pnpm --dir landing run lint

      - name: Landing typecheck
        run: pnpm --dir landing run typecheck

      - name: Landing build
        run: pnpm --dir landing run build

  nightly_maintenance:
    name: Nightly Maintenance Gates
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Install OCR native smoke tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Production dependency audit
        run: pnpm run check:production-dependency-audit

      - name: WASM freshness
        run: pnpm run check:wasm:portable

      - name: Lint
        run: pnpm run lint

      - name: Static reports
        run: pnpm run check:static:reports

      - name: Static assets
        run: pnpm run check:static:assets

      - name: Typecheck
        run: pnpm run typecheck

      - name: Type coverage
        run: pnpm run typecheck:coverage

      - name: Strict build
        run: pnpm run build:strict:no-wasm-check

      - name: Fallow dead code
        run: pnpm run fallow

      - name: Fallow duplicates
        run: pnpm run fallow:dupes

      - name: Rust tests
        run: pnpm run test:rust

      - name: Coverage
        run: pnpm run test:coverage

      - name: OCR native smoke
        run: pnpm run test:ocr:native-smoke:required

  nightly_scan_cleanup_regress:
    name: Nightly Scan-cleanup Regression Net
    # Runs only when the repository declares where the private fixture
    # manifest lives; a stock runner without fixtures must skip, not fail.
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.EVB_SCAN_CLEANUP_REGRESS_MANIFEST != '' }}
    runs-on: macos-14
    timeout-minutes: 25
    env:
      EVB_SCAN_CLEANUP_REGRESS_MANIFEST: ${{ vars.EVB_SCAN_CLEANUP_REGRESS_MANIFEST || '.devkit/scan-cleanup-regress.json' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Install scan-cleanup audit tools
        run: |
          brew install qpdf poppler imagemagick
          python3 -m pip install --user --disable-pip-version-check Pillow==11.3.0

      - name: Build and stage scan-cleanup native binaries
        run: |
          cargo build --manifest-path native/scan-cleanup/Cargo.toml --release --locked
          cargo build --manifest-path native/pdf-image-combine/Cargo.toml --release --locked
          cargo build --manifest-path native/pdf-page-ops/Cargo.toml --release --locked
          mkdir -p .tmp/scan-cleanup/darwin-arm64/bin
          mkdir -p .tmp/pdf-image-combine/darwin-arm64/bin
          mkdir -p .tmp/pdf-page-ops/darwin-arm64/bin
          cp native/target/release/evb-scan-cleanup .tmp/scan-cleanup/darwin-arm64/bin/evb-scan-cleanup
          cp native/target/release/evb-pdf-image-combine .tmp/pdf-image-combine/darwin-arm64/bin/evb-pdf-image-combine
          cp native/target/release/evb-pdf-page-ops .tmp/pdf-page-ops/darwin-arm64/bin/evb-pdf-page-ops
          chmod +x .tmp/scan-cleanup/darwin-arm64/bin/evb-scan-cleanup
          chmod +x .tmp/pdf-image-combine/darwin-arm64/bin/evb-pdf-image-combine
          chmod +x .tmp/pdf-page-ops/darwin-arm64/bin/evb-pdf-page-ops

      - name: Require private nightly fixture manifest
        run: test -r "$EVB_SCAN_CLEANUP_REGRESS_MANIFEST"

      - name: Scan-cleanup regress plus Rome mode matrix
        run: pnpm scan-cleanup:regress -- --manifest "$EVB_SCAN_CLEANUP_REGRESS_MANIFEST"

      - name: Upload scan-cleanup regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: scan-cleanup-regress-${{ github.run_attempt }}
          path: .devkit/scan-cleanup-regress*
          if-no-files-found: ignore

  nightly_electron_e2e_regression:
    name: Nightly Electron E2E Regression
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: Electron E2E regression
        run: pnpm run test:e2e:electron:regression

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-regression-${{ github.run_attempt }}

  nightly_electron_e2e_save_pipeline:
    name: Nightly Electron E2E Save Pipeline
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: Electron E2E save pipeline
        run: pnpm run test:e2e:electron:save-pipeline

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-save-pipeline-${{ github.run_attempt }}

  nightly_electron_e2e_rapid_navigation:
    name: Nightly Electron E2E Rapid Navigation
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: Electron E2E rapid navigation
        run: pnpm run test:e2e:electron:rapid-navigation

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-rapid-navigation-${{ github.run_attempt }}

  nightly_electron_e2e_large_pdf:
    name: Nightly Electron E2E Large PDF
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: Electron E2E large PDF
        run: pnpm run test:e2e:electron:large

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-large-pdf-${{ github.run_attempt }}

  nightly_electron_e2e_quarantine:
    name: Nightly Electron E2E Quarantine
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: Electron E2E quarantine
        run: pnpm run test:e2e:electron:quarantine

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-quarantine-${{ github.run_attempt }}

  nightly_electron_e2e_visible_window:
    name: Nightly Electron E2E Visible Window
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: Electron E2E visible-window lifecycle
        run: pnpm run test:e2e:electron:visible-window

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-visible-window-${{ github.run_attempt }}

  nightly_pdf_tabs_diagnostics:
    name: Nightly PDF Tab Diagnostics
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: PDF tab diagnostics
        run: pnpm run diag:pdf-tabs:ci

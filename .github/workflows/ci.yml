name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Shared Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm run validate

      - name: Unit and integration tests
        run: pnpm test

      - name: Resource matrix check (host)
        run: pnpm run check:resources:matrix

  electron-e2e:
    name: Electron Extended
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs:
      - quality
      - electron-e2e-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle native tools (Linux E2E)
        timeout-minutes: 20
        run: bash scripts/bundle-tools-linux.sh

      - name: Run Electron E2E extended tests
        run: xvfb-run -a --server-args="-screen 0 1440x900x24 -ac +extension RANDR" pnpm run test:e2e:electron:extended

      - name: Upload Electron session logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-session-logs
          path: .devkit/sessions/**/session.log
          if-no-files-found: ignore

  electron-e2e-smoke:
    name: Electron Smoke
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle native tools (Linux E2E smoke)
        timeout-minutes: 20
        run: bash scripts/bundle-tools-linux.sh

      - name: Run Electron E2E smoke tests
        run: xvfb-run -a --server-args="-screen 0 1440x900x24 -ac +extension RANDR" pnpm run test:e2e:electron:smoke

      - name: Upload Electron smoke session logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-smoke-session-logs
          path: .devkit/sessions/**/session.log
          if-no-files-found: ignore

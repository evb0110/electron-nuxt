name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:

permissions:
  contents: read

env:
  # Pin exact Node 24 patch level so CI does not drift independently of local verification.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Shared Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Validate
        run: pnpm run validate

      - name: Unit and integration tests
        run: pnpm run test:release

  landing_quality:
    name: Landing Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect landing changes
        id: changes
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          if git diff --name-only "origin/$BASE_REF...HEAD" -- landing/ | grep -q .; then
            echo "landing=true" >> "$GITHUB_OUTPUT"
          else
            echo "landing=false" >> "$GITHUB_OUTPUT"
            echo "No landing changes detected; skipping landing checks."
          fi

      - name: Setup pnpm
        if: steps.changes.outputs.landing == 'true'
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        if: steps.changes.outputs.landing == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install landing dependencies
        if: steps.changes.outputs.landing == 'true'
        run: pnpm --dir landing install --frozen-lockfile

      - name: Landing typecheck
        if: steps.changes.outputs.landing == 'true'
        run: pnpm --dir landing run typecheck

      - name: Landing build
        if: steps.changes.outputs.landing == 'true'
        run: pnpm --dir landing run build

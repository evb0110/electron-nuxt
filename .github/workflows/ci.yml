name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin exact Node 24 patch level so CI does not drift independently of local verification.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pr_quality:
    name: Pull Request Quality Gates
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

  manual_quality:
    name: Manual Quality Gates
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: WASM portable build
        run: pnpm run check:wasm:portable

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Type coverage
        run: pnpm run typecheck:coverage

      - name: Strict build
        run: pnpm run build:strict

      - name: Fallow dead code
        run: pnpm run fallow

      - name: Fallow duplicates
        run: pnpm run fallow:dupes

      - name: Architecture dependency graph
        run: pnpm run check:architecture:dep-graph

      - name: Architecture boundaries
        run: pnpm run check:architecture:boundaries

      - name: Architecture source size
        run: pnpm run check:architecture:source-size

      - name: Coverage
        run: pnpm run test:coverage

  manual_native:
    name: Native Rust Tests
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Rust tests
        run: pnpm run test:rust

  manual_landing:
    name: Landing Quality Gates
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install landing dependencies
        run: pnpm --dir landing install --frozen-lockfile

      - name: Landing vendor check
        run: pnpm --dir landing run check:vendor

      - name: Landing typecheck
        run: pnpm --dir landing run typecheck

      - name: Landing build
        run: pnpm --dir landing run build

  nightly_maintenance:
    name: Nightly Maintenance Gates
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: WASM freshness
        run: pnpm run check:wasm:freshness

      - name: Install page processor smoke dependencies
        run: python -m pip install 'numpy>=2.0.0' 'opencv-python-headless>=4.10.0' 'img2pdf>=0.6.3' 'Pillow>=10.0.0'

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Type coverage
        run: pnpm run typecheck:coverage

      - name: Strict build
        run: pnpm run build:strict

      - name: Fallow dead code
        run: pnpm run fallow

      - name: Fallow duplicates
        run: pnpm run fallow:dupes

      - name: Architecture dependency graph
        run: pnpm run check:architecture:dep-graph

      - name: Architecture boundaries
        run: pnpm run check:architecture:boundaries

      - name: Architecture source size
        run: pnpm run check:architecture:source-size

      - name: Rust tests
        run: pnpm run test:rust

      - name: Coverage
        run: pnpm run test:coverage

      - name: OCR language model registry
        run: pnpm run check:ocr-language-model-registry

      - name: Page processor smoke
        run: pnpm run test:python-page-processor

  nightly_electron_e2e:
    name: Nightly Electron E2E Smoke
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: Electron E2E smoke
        env:
          EVB_E2E_REQUIRE_DJVU_FIXTURE: '1'
        run: pnpm run test:e2e:electron

  nightly_electron_e2e_rapid_navigation:
    name: Nightly Electron E2E Rapid Navigation
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: Electron E2E rapid navigation
        run: pnpm run test:e2e:electron:rapid-navigation

  nightly_electron_e2e_large_pdf:
    name: Nightly Electron E2E Large PDF
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: Electron E2E large PDF
        env:
          EVB_E2E_REQUIRE_LARGE_PDF_FIXTURE: '1'
        run: pnpm run test:e2e:electron:large

  nightly_electron_e2e_quarantine:
    name: Nightly Electron E2E Quarantine
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: Electron E2E quarantine
        run: pnpm run test:e2e:electron:quarantine

  nightly_pdf_tabs_diagnostics:
    name: Nightly PDF Tab Diagnostics
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: PDF tab diagnostics
        run: pnpm run diag:pdf-tabs:ci

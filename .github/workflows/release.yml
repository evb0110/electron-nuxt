name: Release
run-name: Release ${{ inputs.tag }}

concurrency:
  # Stable-channel publication is global state. Different tags must not race
  # each other while updating the mirror pointer or GitHub release channel.
  group: release-${{ github.repository }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, package, and publish (for example v1.2.3).
        required: true
        type: string
      target_ref:
        description: Exact commit SHA or ref to release. The checked-out package.json version must match the tag.
        required: true
        type: string
      scan_cleanup_fixture:
        description: Optional repository-relative packaged scan-cleanup fixture override.
        required: false
        type: string
      scan_cleanup_expected_pages:
        description: Optional expected page count for the packaged scan-cleanup fixture override.
        required: false
        type: string

permissions:
  contents: read

env:
  # Pin exact Node 24 patch level so release orchestration matches build jobs.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Resolve Target
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      target_sha: ${{ steps.validate.outputs.target_sha }}
      version: ${{ steps.target.outputs.version }}
      workflow_sha: ${{ steps.workflow_trust.outputs.workflow_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted workflow revision
        id: workflow_trust
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release workflow revision is not an exact commit SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$WORKFLOW_SHA" refs/remotes/origin/main; then
            echo "::error::Release workflow revision $WORKFLOW_SHA is not reachable from protected main."
            exit 1
          fi
          echo "workflow_sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve requested release
        id: target
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_TARGET_REF: ${{ inputs.target_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$DISPATCH_TAG"

          if [ -z "$TAG" ]; then
            echo "::error::A release tag is required."
            exit 1
          fi
          if [ -z "$DISPATCH_TARGET_REF" ]; then
            echo "::error::A target commit SHA or ref is required."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Stable public release tag must be exactly vMAJOR.MINOR.PATCH."
            exit 1
          fi

          target_sha="$(git rev-parse --verify "${DISPATCH_TARGET_REF}^{commit}" 2>/dev/null || true)"
          if [ -z "$target_sha" ]; then
            target_sha="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${DISPATCH_TARGET_REF}" \
              --jq .sha 2>/dev/null || true)"
          fi
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve target ref '$DISPATCH_TARGET_REF' to one exact commit."
            exit 1
          fi

          git fetch --no-tags --depth=1 origin "$target_sha"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify protected-main ancestry and exact-SHA CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail

          # target_ref is operator input. Do not execute that checkout or expose
          # release secrets until protected main and its aggregate CI gate have
          # vouched for this exact commit.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TARGET_SHA" refs/remotes/origin/main; then
            echo "::error::Release target $TARGET_SHA is not reachable from protected main."
            exit 1
          fi

          # The wait script runs from this job's dispatch-ref checkout (the
          # trusted main-tip revision; the target detach happens only in the
          # later Validate step). Its budgets are policy-tested against the
          # blocking CI job timeouts so the release wait can never fall
          # behind its own CI graph again (issue #109).
          node scripts/release/wait-for-exact-sha-ci.mjs "$TARGET_SHA"
          echo "::notice::Release target $TARGET_SHA is on protected main and passed exact-SHA CI."

      - name: Validate target
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail

          # Only now, after ancestry and exact-SHA CI vouched for the target,
          # does this job check out operator-input content.
          git checkout --detach "${{ steps.target.outputs.target_sha }}"
          target_sha="$(git rev-parse HEAD)"
          if [ "$target_sha" != "${{ steps.target.outputs.target_sha }}" ]; then
            echo "::error::Resolved target changed during checkout: expected ${{ steps.target.outputs.target_sha }}, got $target_sha."
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$RELEASE_VERSION" ]; then
            echo "::error::package.json version $package_version does not match release tag $RELEASE_TAG."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
            if [ "$tag_sha" != "$target_sha" ]; then
              echo "::error::Existing tag $RELEASE_TAG points at $tag_sha, not requested target $target_sha."
              exit 1
            fi
            echo "::notice::Existing tag $RELEASE_TAG already points at $target_sha; continuing for release repair."
          fi

          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

  release_credentials:
    name: Resolve Public Release Channels
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    outputs:
      submit_store: ${{ steps.channels.outputs.submit_store }}

    steps:
      - name: Resolve public release channels
        id: channels
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          PARTNER_CLIENT_ID: ${{ secrets.PARTNER_CLIENT_ID }}
          PARTNER_CLIENT_SECRET: ${{ secrets.PARTNER_CLIENT_SECRET }}
          PARTNER_TENANT_ID: ${{ secrets.PARTNER_TENANT_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ] \
            || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::Public releases require Developer ID signing and App Store Connect notarization credentials; unsigned or unnotarized macOS artifacts cannot be promoted."
            exit 1
          fi

          if { [ -n "$WIN_CSC_LINK" ] && [ -z "$WIN_CSC_KEY_PASSWORD" ]; } \
            || { [ -z "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; }; then
            echo "::error::Partial Windows signing credentials detected; set both WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD or neither."
            exit 1
          fi
          if [ -z "$WIN_CSC_LINK" ]; then
            echo "::notice::Windows signing credentials are not configured; direct-download Windows installers will be unsigned."
          fi

          submit_store=false
          if [ -n "$PARTNER_TENANT_ID" ] && [ -n "$PARTNER_CLIENT_ID" ] && [ -n "$PARTNER_CLIENT_SECRET" ]; then
            submit_store=true
          else
            echo "::notice::Complete Partner Center credentials are not configured; Microsoft Store submission will be skipped after the AppX packages are built and verified."
          fi
          echo "submit_store=$submit_store" >> "$GITHUB_OUTPUT"

  build_artifacts:
    # Validation authority is the exact-SHA push CI gate that prepare already
    # hard-requires (gates_ok); the release workflow does not rerun the
    # release:verify:checks list a second time.
    name: Package Release Artifacts
    needs:
      - prepare
      - release_credentials
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
      release_environment: release
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

  verify_packaged_scan_cleanup:
    # Advisory evidence, not a publish gate. Its record as a blocking gate:
    # zero real packaged defects caught at release time, and repeated
    # campaign kills from its own UI pins drifting while it sat dormant
    # between releases (issue #82's tail). The toolbar contract it exercised
    # is pinned continuously by the blocking electron smoke lane in push CI
    # (scanCleanupToolbarContract.e2e.test.ts); this job still uploads scale
    # evidence for every release and a failure annotates the run.
    name: Verify packaged scan-cleanup (macOS arm64)
    needs:
      - prepare
      - build_artifacts
    continue-on-error: true
    runs-on: macos-14

    env:
      EVB_RELEASE_SCAN_CLEANUP_FIXTURE: ${{ inputs.scan_cleanup_fixture }}
      EVB_RELEASE_SCAN_CLEANUP_EXPECTED_PAGES: ${{ inputs.scan_cleanup_expected_pages }}

    steps:
      - name: Checkout target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          verify-electron: 'false'

      - name: Resolve required packaged scan-cleanup fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {getPackagedScanCleanupFixture} from './scripts/release/scan-cleanup-release-fixture.mjs';

          const fixture = getPackagedScanCleanupFixture();
          console.log(`Using packaged scan-cleanup fixture: ${fixture.sourcePath}`);
          console.log(`Expected packaged scan-cleanup pages: ${fixture.expectedPages}`);
          const delimiter = `evb_fixture_${crypto.randomUUID()}`;
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `fixture<<${delimiter}\n${fixture.sourcePath}\n${delimiter}\n`,
          );
          appendFileSync(process.env.GITHUB_OUTPUT, `expected_pages=${fixture.expectedPages}\n`);
          NODE

      - name: Download macOS arm64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-mac-arm64
          path: artifacts

      - name: Extract packaged app
        id: packaged_app
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find artifacts -type f -name '*.zip' -print -quit)"
          if [ -z "$archive" ]; then
            echo "::error::The macOS arm64 build did not publish an app ZIP."
            exit 1
          fi
          extract_dir="$RUNNER_TEMP/evb-release-mac-arm64"
          mkdir -p "$extract_dir"
          ditto -x -k "$archive" "$extract_dir"
          executable="$(find "$extract_dir" -type f -path '*/EVB Viewer.app/Contents/MacOS/EVB Viewer' -print -quit)"
          if [ -z "$executable" ]; then
            echo "::error::The macOS arm64 package did not contain EVB Viewer.app."
            exit 1
          fi
          echo "executable=$executable" >> "$GITHUB_OUTPUT"

      - name: Run packaged scan-cleanup scale verifier
        shell: bash
        env:
          PACKAGED_APP_EXECUTABLE: ${{ steps.packaged_app.outputs.executable }}
          PACKAGED_SCAN_CLEANUP_EXPECTED_PAGES: ${{ steps.fixture.outputs.expected_pages }}
          PACKAGED_SCAN_CLEANUP_FIXTURE: ${{ steps.fixture.outputs.fixture }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/release/verifyPackagedScanCleanup.ts \
            --executable "$PACKAGED_APP_EXECUTABLE" \
            --source "$PACKAGED_SCAN_CLEANUP_FIXTURE" \
            --expected-pages "$PACKAGED_SCAN_CLEANUP_EXPECTED_PAGES" \
            --scale-only \
            --artifact-dir "$RUNNER_TEMP/evb-release-packaged-scan-cleanup"

      - name: Upload packaged scan-cleanup verifier evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-scan-cleanup-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evb-release-packaged-scan-cleanup/**
          include-hidden-files: true
          if-no-files-found: ignore

  build_mac_intel:
    # Supplemental lane (docs/releasing.md "Critical-path rule"): it runs in
    # parallel with the core matrix and its ZIP attaches to the already
    # promoted release in attach_mac_intel. It must never gate publication.
    name: Package Release Artifacts / build (macos-15-intel, mac, x64)
    needs:
      - prepare
      - release_credentials
    uses: ./.github/workflows/build-mac-intel.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
      release_environment: release
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  publish:
    name: Stage GitHub Release
    needs:
      - prepare
      - build_artifacts
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      already_public: ${{ steps.draft_release.outputs.already_public }}
      finalized_draft: ${{ steps.draft_release.outputs.finalized_draft }}

    steps:
      - name: Checkout target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          verify-electron: 'false'

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # dist-* matches exactly the five main build-matrix artifacts; the
          # supplemental Intel ZIP attaches after promotion in attach_mac_intel.
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - name: Validate updater metadata paths
        id: metadata_policy
        shell: bash
        env:
          EVB_RELEASE_HAS_MAC_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
          EVB_RELEASE_HAS_WINDOWS_SIGNING: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          node scripts/release/assert-publish-metadata-policy.mjs artifacts "${{ needs.prepare.outputs.version }}"

      - name: Create or update draft GitHub release
        id: draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "already_public=false" >> "$GITHUB_OUTPUT"
          echo "finalized_draft=false" >> "$GITHUB_OUTPUT"

          # Prefer the GitHub CLI here so the release publish path tracks the
          # runner's current Node/LTS stack instead of a separately versioned
          # JavaScript action runtime.
          release_view_error="$RUNNER_TEMP/release-view-error.txt"
          if release_json="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish 2> "$release_view_error")"; then
            is_draft="$(jq -r .isDraft <<< "$release_json")"
            release_target="$(jq -r .targetCommitish <<< "$release_json")"
            tag_ref_error="$RUNNER_TEMP/release-tag-ref-error.txt"
            if tag_object="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object' 2> "$tag_ref_error")"; then
              tag_type="$(jq -r .type <<< "$tag_object")"
              resolved_release_sha="$(jq -r .sha <<< "$tag_object")"
              for _ in $(seq 1 5); do
                [ "$tag_type" = 'tag' ] || break
                tag_object="$(gh api \
                  -H 'Accept: application/vnd.github+json' \
                  "repos/${GITHUB_REPOSITORY}/git/tags/${resolved_release_sha}" \
                  --jq '.object')"
                tag_type="$(jq -r .type <<< "$tag_object")"
                resolved_release_sha="$(jq -r .sha <<< "$tag_object")"
              done
              if [ "$tag_type" != 'commit' ]; then
                echo "::error::Existing release tag $RELEASE_TAG did not resolve to a commit."
                exit 1
              fi
            elif [ "$is_draft" = 'true' ]; then
              # GitHub may not create refs/tags/<tag> until a draft is
              # published. Resolve the draft's target commitish through the
              # commits API in that state; public releases must have the tag.
              resolved_release_sha="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/commits/${release_target}" \
                --jq .sha)"
            else
              cat "$tag_ref_error" >&2
              exit 1
            fi
            if [ "$resolved_release_sha" != "$TARGET_SHA" ]; then
              echo "::error::Existing release $RELEASE_TAG resolves to $resolved_release_sha instead of $TARGET_SHA; refusing to reuse or mutate it."
              exit 1
            fi
            if [ "$is_draft" != "true" ]; then
              echo "already_public=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Release $RELEASE_TAG is already public at the expected commit; verifying its assets without replacing them."
            else
              existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
              if grep -Fqx 'SHA256SUMS' <<< "$existing_assets"; then
                # A checksum-finalized draft may already have immutable mirror
                # objects from a failed later channel. Keep that exact byte set
                # and verify its manifest below so retries remain idempotent.
                echo "finalized_draft=true" >> "$GITHUB_OUTPUT"
                echo "::notice::Retaining checksum-finalized draft assets from the same target."
              else
                # An unfinished draft has no immutable identity yet. Replace its
                # whole expected set instead of combining artifacts from builds.
                while IFS= read -r existing_name; do
                  if [ -n "$existing_name" ] && [ ! -f "artifacts/$existing_name" ]; then
                    gh release delete-asset "$RELEASE_TAG" "$existing_name" --yes
                  fi
                done <<< "$existing_assets"
                for source in artifacts/*; do
                  gh release upload "$RELEASE_TAG" "$source" --clobber
                done
              fi
            fi
          elif grep -Fq 'release not found' "$release_view_error"; then
            gh release create "$RELEASE_TAG" artifacts/* --draft --generate-notes --target "$TARGET_SHA"
          else
            cat "$release_view_error" >&2
            exit 1
          fi

      - name: Verify published release assets
        id: uploaded_assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ALREADY_PUBLIC: ${{ steps.draft_release.outputs.already_public }}
          FINALIZED_DRAFT: ${{ steps.draft_release.outputs.finalized_draft }}
          EVB_RELEASE_HAS_MAC_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
          EVB_RELEASE_HAS_WINDOWS_SIGNING: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir downloaded-assets
          gh release download "$RELEASE_TAG" --dir downloaded-assets
          node scripts/release/assert-publish-metadata-policy.mjs downloaded-assets "${{ needs.prepare.outputs.version }}"

          if [ "$ALREADY_PUBLIC" = "true" ] || [ "$FINALIZED_DRAFT" = "true" ]; then
            node scripts/release/release-checksums.mjs verify downloaded-assets "$RELEASE_VERSION"
          fi

          for source in artifacts/*; do
            name="$(basename "$source")"
            downloaded="downloaded-assets/$name"
            if [ ! -f "$downloaded" ]; then
              echo "::error::Uploaded release asset is missing after download: $name"
              exit 1
            fi
            if [ "$ALREADY_PUBLIC" != "true" ] && [ "$FINALIZED_DRAFT" != "true" ] \
              && [ "$(sha256sum "$source" | cut -d' ' -f1)" != "$(sha256sum "$downloaded" | cut -d' ' -f1)" ]; then
              echo "::error::Uploaded release asset hash mismatch: $name"
              exit 1
            fi
          done

          if [ "$FINALIZED_DRAFT" = "true" ]; then
            for downloaded in downloaded-assets/*; do
              name="$(basename "$downloaded")"
              case "$name" in
                # Supplemental assets attach after promotion and are outside
                # the immutable core set (policy.mjs isSupplementalReleaseAsset).
                # Only this release's exact expected asset name is exempt.
                'SHA256SUMS' | "EVB-Viewer-${RELEASE_VERSION}-x64.zip") continue ;;
              esac
              if [ ! -f "artifacts/$name" ]; then
                echo "::error::Checksum-finalized draft contains an unexpected asset: $name"
                exit 1
              fi
            done
          fi

          if [ "$ALREADY_PUBLIC" = "true" ]; then
            echo "::notice::Existing public assets passed presence and updater integrity checks; immutable checksum verification runs at promotion."
          fi

      - name: Report release gate outcomes
        if: ${{ always() }}
        shell: bash
        env:
          METADATA_POLICY_OUTCOME: ${{ steps.metadata_policy.outcome }}
          DRAFT_RELEASE_OUTCOME: ${{ steps.draft_release.outcome }}
          UPLOADED_ASSETS_OUTCOME: ${{ steps.uploaded_assets.outcome }}
          ALREADY_PUBLIC: ${{ steps.draft_release.outputs.already_public }}
        run: |
          {
            echo '## GitHub release gate outcomes'
            echo
            echo '| Actual gate | Outcome |'
            echo '| --- | --- |'
            echo "| Updater metadata path policy | $METADATA_POLICY_OUTCOME |"
            echo "| Draft release creation/upload | $DRAFT_RELEASE_OUTCOME |"
            echo "| Published asset presence and integrity | $UPLOADED_ASSETS_OUTCOME |"
            echo "| Existing public release reused | ${ALREADY_PUBLIC:-false} |"
            echo '| Public promotion | deferred until required distribution channels complete |'
          } >> "$GITHUB_STEP_SUMMARY"

  finalize_release_assets:
    name: Finalize Immutable Release Asset Set
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout trusted release helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.workflow_sha }}
          persist-credentials: false

      - name: Download every staged GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          gh release download "$RELEASE_TAG" --dir artifacts

      - name: Publish or verify immutable release checksums
        env:
          ALREADY_PUBLIC: ${{ needs.publish.outputs.already_public }}
          FINALIZED_DRAFT: ${{ needs.publish.outputs.finalized_draft }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          checksum_path="artifacts/SHA256SUMS"
          if [ "$ALREADY_PUBLIC" = 'true' ] || [ "$FINALIZED_DRAFT" = 'true' ]; then
            node scripts/release/release-checksums.mjs verify artifacts "$RELEASE_VERSION"
          else
            node scripts/release/release-checksums.mjs generate artifacts
            node scripts/release/release-checksums.mjs verify artifacts "$RELEASE_VERSION"
            gh release upload "$RELEASE_TAG" "$checksum_path" --clobber
          fi

      - name: Attest final release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/*

  stage_mirror:
    name: Stage Regional Release Mirror
    needs:
      - prepare
      - finalize_release_assets
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Draft releases are invisible to read-only tokens, and this job
      # downloads the still-unpublished draft's assets; it writes nothing to
      # the repository itself.
      contents: write

    steps:
      - name: Checkout target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The mirror publisher belongs to the workflow revision, not the
          # potentially older release commit whose artifacts are mirrored.
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.workflow_sha }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'

      - name: Install mirror publisher dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download every staged GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          gh release download "$RELEASE_TAG" --dir artifacts

      - name: Upload and verify immutable release objects
        env:
          MIRROR_S3_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          MIRROR_S3_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          MIRROR_S3_ACCESS_KEY_ID: ${{ secrets.MIRROR_S3_ACCESS_KEY_ID }}
          MIRROR_S3_SECRET_KEY: ${{ secrets.MIRROR_S3_SECRET_KEY }}
        run: node scripts/release/publish-release-mirror.mjs artifacts "${{ needs.prepare.outputs.tag }}" --stage

  publish_store:
    name: Package and Reconcile Microsoft Store AppX
    needs:
      - prepare
      - release_credentials
      - stage_mirror
    uses: ./.github/workflows/store-appx.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
      submit: ${{ needs.release_credentials.outputs.submit_store == 'true' }}
    secrets:
      PARTNER_TENANT_ID: ${{ secrets.PARTNER_TENANT_ID }}
      PARTNER_CLIENT_ID: ${{ secrets.PARTNER_CLIENT_ID }}
      PARTNER_CLIENT_SECRET: ${{ secrets.PARTNER_CLIENT_SECRET }}

  promote_release:
    name: Promote Verified Release
    needs:
      - prepare
      - publish
      - stage_mirror
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout trusted release publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.workflow_sha }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'

      - name: Install mirror publisher dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download every staged GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          gh release download "$RELEASE_TAG" --dir artifacts

      - name: Activate verified mirror channel
        id: mirror_activation
        env:
          MIRROR_S3_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          MIRROR_S3_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          MIRROR_S3_ACCESS_KEY_ID: ${{ secrets.MIRROR_S3_ACCESS_KEY_ID }}
          MIRROR_S3_SECRET_KEY: ${{ secrets.MIRROR_S3_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # One activation pass hash-verifies every immutable release object
          # (~1.3 GB) before touching the channel pointer; a 30-second bound
          # killed each attempt mid-verification on the first run that ever
          # reached this step. Keep activation bounded, but budget for the
          # verification it necessarily performs.
          for attempt in 1 2 3; do
            if timeout 600s node scripts/release/publish-release-mirror.mjs artifacts "${{ needs.prepare.outputs.tag }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::Stable mirror activation did not complete within the bounded reconciliation window.'
              exit 1
            fi
            echo "Mirror activation attempt $attempt failed. Retrying in 30 seconds."
            sleep 30
          done

      - name: Promote verified GitHub draft
        id: github_promotion
        if: ${{ needs.publish.outputs.already_public != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Report verified promotion outcomes
        if: ${{ always() }}
        shell: bash
        env:
          GITHUB_PROMOTION_OUTCOME: ${{ steps.github_promotion.outcome }}
          GITHUB_ALREADY_PUBLIC: ${{ needs.publish.outputs.already_public }}
          MIRROR_ACTIVATION_OUTCOME: ${{ steps.mirror_activation.outcome }}
        run: |
          {
            echo '## Verified release promotion'
            echo
            echo '| Channel | Outcome |'
            echo '| --- | --- |'
            if [ "$GITHUB_ALREADY_PUBLIC" = 'true' ]; then
              GITHUB_PROMOTION_STATUS='already public'
            else
              GITHUB_PROMOTION_STATUS="$GITHUB_PROMOTION_OUTCOME"
            fi
            echo "| GitHub release promotion | $GITHUB_PROMOTION_STATUS |"
            echo "| Regional mirror activation | $MIRROR_ACTIVATION_OUTCOME |"
            echo '| Microsoft Store reconciliation | reported by its own job; does not gate promotion |'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MIRROR_ACTIVATION_OUTCOME" != 'success' ] || {
            [ "$GITHUB_PROMOTION_OUTCOME" != 'success' ] &&
            [ "$GITHUB_ALREADY_PUBLIC" != 'true' ]
          }; then
            echo '::error::Release channels did not converge. Reconcile the stable mirror and GitHub release before announcing this version.'
            exit 1
          fi

  attach_mac_intel:
    # Attach-afterward semantics for the supplemental Intel channel: the
    # release is already public and checksum-finalized when this runs, and the
    # Intel ZIP intentionally stays outside the immutable SHA256SUMS set
    # (release verification tolerates it via policy.mjs). An Intel-lane
    # failure downgrades to a warning here instead of failing the release.
    name: Attach Supplemental macOS Intel Asset
    needs:
      - prepare
      - build_mac_intel
      - promote_release
    if: ${{ !cancelled() && needs.promote_release.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Report unavailable Intel lane
        if: ${{ needs.build_mac_intel.result != 'success' }}
        run: echo "::warning::Supplemental macOS Intel build concluded '${{ needs.build_mac_intel.result }}'; the published release ships without the Intel ZIP until a repair run attaches it."

      - name: Download macOS Intel artifacts
        if: ${{ needs.build_mac_intel.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: supplemental-mac-x64
          path: artifacts
          merge-multiple: true

      - name: Validate the expected Intel ZIP
        if: ${{ needs.build_mac_intel.result == 'success' }}
        id: intel_asset
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Accept exactly the expected version-specific asset. The release is
          # already public here, so unexpected extra files in the supplemental
          # artifact only warn (and are never uploaded); a missing expected
          # ZIP from a successful Intel build is a real contract break.
          expected="artifacts/EVB-Viewer-${RELEASE_VERSION}-x64.zip"
          if [ ! -f "$expected" ]; then
            echo "::error::Supplemental Intel artifact did not contain $(basename "$expected")."
            exit 1
          fi
          for source in artifacts/*; do
            if [ "$source" != "$expected" ]; then
              echo "::warning::Supplemental Intel artifact contained an unexpected file that was not attached: $(basename "$source")."
            fi
          done
          echo "expected=$expected" >> "$GITHUB_OUTPUT"

      - name: Attest the supplemental Intel asset
        if: ${{ needs.build_mac_intel.result == 'success' }}
        # The Intel ZIP stays outside SHA256SUMS, so provenance attestation is
        # its integrity record, matching what finalize gives the core assets.
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.intel_asset.outputs.expected }}

      - name: Attach Intel ZIP to the published release
        if: ${{ needs.build_mac_intel.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_ASSET: ${{ steps.intel_asset.outputs.expected }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$EXPECTED_ASSET" --clobber

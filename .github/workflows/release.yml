name: Release
run-name: Release (${{ inputs.tag || github.ref_name }})

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate, package, and publish (for example v1.2.3).
        required: true
        type: string

permissions:
  contents: write

env:
  # Pin exact Node 24 patch level so release orchestration matches build jobs.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Resolve Target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      target_sha: ${{ steps.sha.outputs.target_sha }}

    steps:
      - name: Resolve tag
        id: target
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::A release tag is required."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release tag must look like v1.2.3 and may only contain letters, numbers, dots, and hyphens."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout target
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.target.outputs.tag }}

      - name: Capture target sha
        id: sha
        shell: bash
        run: echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    name: Shared Quality Gates
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Release checks
        env:
          EVB_NATIVE_TOOLS_ALLOW_HOST_CI_GEN: '1'
        run: pnpm run release:verify:checks

  build_artifacts:
    name: Package Release Artifacts
    needs:
      - prepare
      - quality
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
    secrets: inherit

  build_mac_intel:
    # Supplemental macOS Intel ZIP packaging must not delay release creation.
    # It runs in parallel and, if successful, gets attached to the existing
    # release in a later job.
    name: Package Release Artifacts / build (macos-15-intel, mac, x64)
    needs:
      - prepare
      - quality
    uses: ./.github/workflows/build-mac-intel.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
    secrets: inherit

  build_win7_legacy:
    # Supplemental Windows 7 packaging is best-effort only. It must never sit
    # on the main release critical path because it depends on a downgraded
    # Electron line and host-side validation on an unsupported OS.
    name: Package Release Artifacts / build (windows-2022, win7 legacy, x64)
    needs:
      - prepare
      - quality
    uses: ./.github/workflows/build-win7-legacy.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
    secrets: inherit

  publish:
    name: Create GitHub Release
    needs:
      - prepare
      - build_artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          # dist-* matches exactly the five main build-matrix artifacts; the
          # supplemental lanes upload under supplemental-*/legacy-* and attach
          # in their own follow-up jobs.
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - name: Validate updater metadata paths
        shell: bash
        env:
          EVB_RELEASE_HAS_MAC_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
          EVB_RELEASE_HAS_WINDOWS_SIGNING: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          node scripts/release/assert-publish-metadata-policy.mjs artifacts

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the GitHub CLI here so the release publish path tracks the
          # runner's current Node/LTS stack instead of a separately versioned
          # JavaScript action runtime.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --generate-notes --verify-tag
          fi

  publish_mac_intel:
    name: Attach macOS Intel Release Asset
    needs:
      - prepare
      - publish
      - build_mac_intel
    if: ${{ needs.publish.result == 'success' && needs.build_mac_intel.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: supplemental-mac-x64
          path: artifacts
          merge-multiple: true

      - name: Attach macOS Intel assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" artifacts/* --clobber

  publish_win7_legacy:
    name: Attach Windows 7 Legacy Release Asset
    needs:
      - prepare
      - publish
      - build_win7_legacy
    if: ${{ needs.publish.result == 'success' && needs.build_win7_legacy.outputs.artifact_ready == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Download Windows 7 legacy artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: legacy-win7-*
          path: artifacts
          merge-multiple: true

      - name: Attach Windows 7 legacy assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" artifacts/* --clobber

name: Release
run-name: Release (${{ inputs.tag || github.ref_name }})

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate, package, and publish (for example v1.2.3).
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Resolve Target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      target_sha: ${{ steps.sha.outputs.target_sha }}

    steps:
      - name: Resolve tag
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::A release tag is required."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout target
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.target.outputs.tag }}

      - name: Capture target sha
        id: sha
        shell: bash
        run: echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    name: Shared Quality Gates
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release checks
        run: pnpm run release:verify:checks

  build_artifacts:
    name: Package Release Artifacts
    needs:
      - prepare
      - quality
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
    secrets: inherit

  build_mac_intel:
    # Supplemental macOS Intel ZIP packaging must not delay release creation.
    # It runs in parallel and, if successful, gets attached to the existing
    # release in a later job.
    name: Package Release Artifacts / build (macos-15-intel, mac, x64)
    needs:
      - prepare
      - quality
    uses: ./.github/workflows/build-mac-intel.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
    secrets: inherit

  build_win7_legacy:
    # Supplemental Windows 7 packaging is best-effort only. It must never sit
    # on the main release critical path because it depends on a downgraded
    # Electron line and host-side validation on an unsupported OS.
    name: Package Release Artifacts / build (windows-2022, win7 legacy, x64)
    needs:
      - prepare
      - quality
    uses: ./.github/workflows/build-win7-legacy.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
    secrets: inherit

  publish:
    name: Create GitHub Release
    needs:
      - prepare
      - build_artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - name: Validate updater metadata paths
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          yml_files=(artifacts/latest*.yml)
          if [ ${#yml_files[@]} -eq 0 ]; then
            echo "No updater metadata published for this release; continuing with manual-install artifacts only."
            exit 0
          fi

          for yml in "${yml_files[@]}"; do
            rel_path="$(awk '/^path: / {print $2; exit}' "$yml" | tr -d '"' | tr -d "'")"
            if [ -z "$rel_path" ]; then
              echo "::error::Missing path entry in $yml"
              exit 1
            fi
            if [ ! -f "artifacts/$rel_path" ]; then
              echo "::error::Updater metadata mismatch in $yml -> $rel_path not found"
              echo "Available artifacts:"
              ls -la artifacts
              exit 1
            fi
          done

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the GitHub CLI here so the release publish path tracks the
          # runner's current Node/LTS stack instead of a separately versioned
          # JavaScript action runtime.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --generate-notes --verify-tag
          fi

  publish_mac_intel:
    name: Attach macOS Intel Release Asset
    needs:
      - prepare
      - publish
      - build_mac_intel
    if: ${{ needs.publish.result == 'success' && needs.build_mac_intel.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-mac-x64
          path: artifacts
          merge-multiple: true

      - name: Attach macOS Intel assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" artifacts/* --clobber

  publish_win7_legacy:
    name: Attach Windows 7 Legacy Release Asset
    needs:
      - prepare
      - publish
      - build_win7_legacy
    if: ${{ needs.publish.result == 'success' && needs.build_win7_legacy.outputs.artifact_ready == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Download Windows 7 legacy artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-win7-legacy-*
          path: artifacts
          merge-multiple: true

      - name: Attach Windows 7 legacy assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" artifacts/* --clobber

name: Release
run-name: Release ${{ inputs.tag }}

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.run_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, package, and publish (for example v1.2.3).
        required: true
        type: string
      target_ref:
        description: Exact commit SHA or ref to release. The checked-out package.json version must match the tag.
        required: true
        type: string

permissions:
  contents: write

env:
  # Pin exact Node 24 patch level so release orchestration matches build jobs.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Resolve Target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      target_sha: ${{ steps.validate.outputs.target_sha }}
      version: ${{ steps.target.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve requested release
        id: target
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_TARGET_REF: ${{ inputs.target_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$DISPATCH_TAG"

          if [ -z "$TAG" ]; then
            echo "::error::A release tag is required."
            exit 1
          fi
          if [ -z "$DISPATCH_TARGET_REF" ]; then
            echo "::error::A target commit SHA or ref is required."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release tag must look like v1.2.3 and may only contain letters, numbers, dots, and hyphens."
            exit 1
          fi

          target_sha="$(git rev-parse --verify "${DISPATCH_TARGET_REF}^{commit}" 2>/dev/null || true)"
          if [ -z "$target_sha" ]; then
            target_sha="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${DISPATCH_TARGET_REF}" \
              --jq .sha 2>/dev/null || true)"
          fi
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve target ref '$DISPATCH_TARGET_REF' to one exact commit."
            exit 1
          fi

          git fetch --no-tags --depth=1 origin "$target_sha"
          git checkout --detach "$target_sha"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate target
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail

          target_sha="$(git rev-parse HEAD)"
          if [ "$target_sha" != "${{ steps.target.outputs.target_sha }}" ]; then
            echo "::error::Resolved target changed during checkout: expected ${{ steps.target.outputs.target_sha }}, got $target_sha."
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$RELEASE_VERSION" ]; then
            echo "::error::package.json version $package_version does not match release tag $RELEASE_TAG."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
            if [ "$tag_sha" != "$target_sha" ]; then
              echo "::error::Existing tag $RELEASE_TAG points at $tag_sha, not requested target $target_sha."
              exit 1
            fi
            echo "::notice::Existing tag $RELEASE_TAG already points at $target_sha; continuing for release repair."
          fi

          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

  quality:
    name: Shared Quality Gates
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            landing/pnpm-lock.yaml

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Install landing test dependencies
        run: pnpm --dir landing install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Release checks
        env:
          EVB_NATIVE_TOOLS_ALLOW_HOST_CI_GEN: '1'
        run: pnpm run release:verify:checks

  build_artifacts:
    name: Package Release Artifacts
    needs:
      - prepare
      - quality
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
    secrets: inherit

  build_mac_intel:
    # Supplemental macOS Intel ZIP packaging must not delay release creation.
    # It runs in parallel and, if successful, gets attached to the existing
    # release in a later job.
    name: Package Release Artifacts / build (macos-15-intel, mac, x64)
    needs:
      - prepare
      - quality
    uses: ./.github/workflows/build-mac-intel.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
    secrets: inherit

  build_win7_legacy:
    # Supplemental Windows 7 packaging is best-effort only. It must never sit
    # on the main release critical path because it depends on a downgraded
    # Electron line and host-side validation on an unsupported OS.
    name: Package Release Artifacts / build (windows-2022, win7 legacy, x64)
    needs:
      - prepare
      - quality
    uses: ./.github/workflows/build-win7-legacy.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
    secrets: inherit

  publish:
    name: Create GitHub Release
    needs:
      - prepare
      - build_artifacts
    runs-on: ubuntu-latest
    outputs:
      already_public: ${{ steps.draft_release.outputs.already_public }}

    steps:
      - name: Checkout target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          # dist-* matches exactly the five main build-matrix artifacts; the
          # supplemental lanes upload under supplemental-*/legacy-* and attach
          # in their own follow-up jobs.
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - name: Validate updater metadata paths
        id: metadata_policy
        shell: bash
        env:
          EVB_RELEASE_HAS_MAC_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
          EVB_RELEASE_HAS_WINDOWS_SIGNING: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          node scripts/release/assert-publish-metadata-policy.mjs artifacts "${{ needs.prepare.outputs.version }}"

      - name: Create or update draft GitHub release
        id: draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "already_public=false" >> "$GITHUB_OUTPUT"

          # Prefer the GitHub CLI here so the release publish path tracks the
          # runner's current Node/LTS stack instead of a separately versioned
          # JavaScript action runtime.
          release_view_error="$RUNNER_TEMP/release-view-error.txt"
          if release_json="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish 2> "$release_view_error")"; then
            is_draft="$(jq -r .isDraft <<< "$release_json")"
            if [ "$is_draft" != "true" ]; then
              release_target="$(jq -r .targetCommitish <<< "$release_json")"
              if [ "$release_target" != "$TARGET_SHA" ]; then
                echo "::error::Public release $RELEASE_TAG targets $release_target instead of $TARGET_SHA; refusing to reuse it."
                exit 1
              fi
              echo "already_public=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Release $RELEASE_TAG is already public at the expected commit; verifying its assets without replacing them."
            else
              gh release upload "$RELEASE_TAG" artifacts/* --clobber
            fi
          elif grep -Fq 'release not found' "$release_view_error"; then
            gh release create "$RELEASE_TAG" artifacts/* --draft --generate-notes --target "$TARGET_SHA"
          else
            cat "$release_view_error" >&2
            exit 1
          fi

      - name: Verify published release assets
        id: uploaded_assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          ALREADY_PUBLIC: ${{ steps.draft_release.outputs.already_public }}
          EVB_RELEASE_HAS_MAC_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
          EVB_RELEASE_HAS_WINDOWS_SIGNING: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir downloaded-assets
          gh release download "$RELEASE_TAG" --dir downloaded-assets
          node scripts/release/assert-publish-metadata-policy.mjs downloaded-assets "${{ needs.prepare.outputs.version }}"

          for source in artifacts/*; do
            name="$(basename "$source")"
            downloaded="downloaded-assets/$name"
            if [ ! -f "$downloaded" ]; then
              echo "::error::Uploaded release asset is missing after download: $name"
              exit 1
            fi
            if [ "$ALREADY_PUBLIC" != "true" ] && [ "$(sha256sum "$source" | cut -d' ' -f1)" != "$(sha256sum "$downloaded" | cut -d' ' -f1)" ]; then
              echo "::error::Uploaded release asset hash mismatch: $name"
              exit 1
            fi
          done

          if [ "$ALREADY_PUBLIC" = "true" ]; then
            echo "::notice::Existing public assets passed presence and updater integrity checks; immutable assets were not compared with rebuilt signed artifacts."
          fi

      - name: Promote verified draft release
        id: promote_release
        if: ${{ steps.draft_release.outputs.already_public != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Report release gate outcomes
        if: ${{ always() }}
        shell: bash
        env:
          METADATA_POLICY_OUTCOME: ${{ steps.metadata_policy.outcome }}
          DRAFT_RELEASE_OUTCOME: ${{ steps.draft_release.outcome }}
          UPLOADED_ASSETS_OUTCOME: ${{ steps.uploaded_assets.outcome }}
          PROMOTE_RELEASE_OUTCOME: ${{ steps.promote_release.outcome }}
          ALREADY_PUBLIC: ${{ steps.draft_release.outputs.already_public }}
        run: |
          {
            echo '## GitHub release gate outcomes'
            echo
            echo '| Actual gate | Outcome |'
            echo '| --- | --- |'
            echo "| Updater metadata path policy | $METADATA_POLICY_OUTCOME |"
            echo "| Draft release creation/upload | $DRAFT_RELEASE_OUTCOME |"
            echo "| Published asset presence and integrity | $UPLOADED_ASSETS_OUTCOME |"
            echo "| Existing public release reused | ${ALREADY_PUBLIC:-false} |"
            echo "| Verified draft promotion | $PROMOTE_RELEASE_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish_mac_intel:
    name: Attach macOS Intel Release Asset
    needs:
      - prepare
      - publish
      - build_mac_intel
    if: ${{ needs.publish.result == 'success' && needs.build_mac_intel.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: supplemental-mac-x64
          path: artifacts
          merge-multiple: true

      - name: Attach macOS Intel assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for source in artifacts/*; do
            name="$(basename "$source")"
            if grep -Fqx "$name" <<< "$existing_assets"; then
              echo "::notice::Public release asset already exists and will not be replaced: $name"
            else
              gh release upload "$RELEASE_TAG" "$source"
            fi
          done

  publish_win7_legacy:
    name: Attach Windows 7 Legacy Release Asset
    needs:
      - prepare
      - publish
      - build_win7_legacy
    if: ${{ needs.publish.result == 'success' && needs.build_win7_legacy.outputs.artifact_ready == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Download Windows 7 legacy artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: legacy-win7-*
          path: artifacts
          merge-multiple: true

      - name: Attach Windows 7 legacy assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for source in artifacts/*; do
            name="$(basename "$source")"
            if grep -Fqx "$name" <<< "$existing_assets"; then
              echo "::notice::Public release asset already exists and will not be replaced: $name"
            else
              gh release upload "$RELEASE_TAG" "$source"
            fi
          done

  publish_mirror:
    name: Publish Regional Release Mirror
    needs:
      - prepare
      - publish
      - publish_mac_intel
      - publish_win7_legacy
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install mirror publisher dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download every published GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          gh release download "$RELEASE_TAG" --dir artifacts

      - name: Upload, verify, and retain four releases
        env:
          MIRROR_S3_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          MIRROR_S3_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          MIRROR_S3_ACCESS_KEY_ID: ${{ secrets.MIRROR_S3_ACCESS_KEY_ID }}
          MIRROR_S3_SECRET_KEY: ${{ secrets.MIRROR_S3_SECRET_KEY }}
        run: node scripts/release/publish-release-mirror.mjs artifacts "${{ needs.prepare.outputs.tag }}"

  publish_store:
    name: Package and Submit Microsoft Store AppX
    needs:
      - prepare
      - publish
    if: ${{ needs.publish.outputs.already_public != 'true' }}
    uses: ./.github/workflows/store-appx.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
      submit: true
    secrets: inherit

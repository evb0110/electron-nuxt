name: Microsoft Store Submission

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit SHA whose Store artifacts are submitted.
        required: false
        type: string
      enabled:
        description: Submit after direct-download provenance is available.
        required: false
        default: false
        type: boolean
    secrets:
      PARTNER_TENANT_ID:
        required: false
      PARTNER_CLIENT_ID:
        required: false
      PARTNER_CLIENT_SECRET:
        required: false

permissions:
  contents: read

env:
  STORE_PRODUCT_ID: '9N3MB1WJGX1L'

jobs:
  submit:
    name: submit to Microsoft Store
    if: ${{ inputs.enabled }}
    runs-on: windows-2022
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Exercise Store submission status contract
        shell: pwsh
        run: .\scripts\release\submit-store-appx.ps1 -RunContractTests

      - name: Download Microsoft Store AppX artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: store-appx-win-*
          path: store-artifacts
          merge-multiple: true

      - name: Validate Store submission credentials
        shell: bash
        env:
          PARTNER_TENANT_ID: ${{ secrets.PARTNER_TENANT_ID }}
          PARTNER_CLIENT_ID: ${{ secrets.PARTNER_CLIENT_ID }}
          PARTNER_CLIENT_SECRET: ${{ secrets.PARTNER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$PARTNER_TENANT_ID" ] || missing+=("PARTNER_TENANT_ID")
          [ -n "$PARTNER_CLIENT_ID" ] || missing+=("PARTNER_CLIENT_ID")
          [ -n "$PARTNER_CLIENT_SECRET" ] || missing+=("PARTNER_CLIENT_SECRET")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Microsoft Store submission was enabled with missing credentials: ${missing[*]}"
            exit 1
          fi

      - name: Compare GitHub and Microsoft Store packaged-app provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir direct-provenance
          for arch in x64 arm64; do
            direct="EVB-Viewer-${version}-win-${arch}-provenance.json"
            store="store-artifacts/EVB-Viewer-${version}-store-${arch}-provenance.json"
            gh release download "v${version}" --pattern "$direct" --dir direct-provenance
            node scripts/release/build-provenance.mjs assert-match "direct-provenance/$direct" "$store"
          done

      - name: Submit Microsoft Store AppX packages
        shell: pwsh
        env:
          PARTNER_TENANT_ID: ${{ secrets.PARTNER_TENANT_ID }}
          PARTNER_CLIENT_ID: ${{ secrets.PARTNER_CLIENT_ID }}
          PARTNER_CLIENT_SECRET: ${{ secrets.PARTNER_CLIENT_SECRET }}
        run: |
          .\scripts\release\submit-store-appx.ps1 `
            -TenantId $env:PARTNER_TENANT_ID `
            -ClientId $env:PARTNER_CLIENT_ID `
            -ClientSecret $env:PARTNER_CLIENT_SECRET `
            -ProductId $env:STORE_PRODUCT_ID `
            -AppPackagesDirectory "${{ github.workspace }}\store-artifacts"

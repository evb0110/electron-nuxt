name: Supplemental macOS Intel Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit SHA to build.
        required: false
        type: string
      release_environment:
        description: Environment used only for signed public-release builds.
        required: false
        default: artifact-build
        type: string
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false

permissions:
  contents: read

env:
  # Pin exact Node 24 patch level so supplemental release builds do not drift under tags.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_mac_intel:
    name: build (macos-15-intel, mac, x64)
    runs-on: macos-15-intel
    environment: ${{ inputs.release_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          rust-targets: wasm32-unknown-unknown
          brew-formulae: tesseract poppler qpdf djvulibre meson pkg-config sphinx-doc

      - name: Bundle native tools (macOS Intel)
        timeout-minutes: 30
        run: |
          bash scripts/bundle-tesseract-macos.sh
          bash scripts/bundle-leptonica-unpaper-macos.sh
          bash scripts/bundle-pdf-tools-macos.sh
          bash scripts/bundle-djvu-macos.sh

      - name: Build (Nuxt + Electron)
        env:
          EVB_NATIVE_TARGET_ARCH: x64
          EVB_NATIVE_TARGET_PLATFORM: mac
        run: pnpm run build:strict

      - name: Configure optional macOS signing and notarization
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/release/configure-macos-signing.sh

      - name: Package installer (macOS Intel)
        # On macos-15-intel runners, DMG creation intermittently fails while
        # detaching the mounted image (hdiutil exit code 16: resource busy).
        # Build the required signed ZIP in this lane and gate release promotion
        # on its successful attachment.
        shell: bash
        run: |
          if [ -n "${MAC_CSC_LINK:-}" ] && [ -n "${MAC_CSC_KEY_PASSWORD:-}" ]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          else
            unset CSC_LINK CSC_KEY_PASSWORD
          fi

          if [ -n "${APPLE_API_KEY_PATH:-}" ] && [ -n "${APPLE_API_KEY_ID_ENV:-}" ] && [ -n "${APPLE_API_ISSUER_ENV:-}" ]; then
            export APPLE_API_KEY="$APPLE_API_KEY_PATH"
            export APPLE_API_KEY_ID="$APPLE_API_KEY_ID_ENV"
            export APPLE_API_ISSUER="$APPLE_API_ISSUER_ENV"
          else
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi

          bash scripts/release/run-with-retries.sh 3 20 "macOS Intel packaging" \
            pnpm exec electron-builder --publish never --mac zip --x64

      - name: Verify macOS signature
        shell: bash
        env:
          MAC_EXPECT_DEVELOPER_ID: ${{ env.MAC_EXPECT_DEVELOPER_ID }}
        run: bash scripts/release/verify-macos-signature.sh

      - name: Verify packaged native tools
        run: bash scripts/verify-packaged-native-tools.sh mac x64

      - name: Verify packaged app contents
        shell: bash
        run: node scripts/release/assert-packaged-app-contents.mjs

      - name: Verify packaged startup
        run: bash scripts/verify-packaged-startup.sh mac x64

      - name: Verify packaged macOS Intel core PDF journey
        shell: bash
        run: |
          executable="$(find release -type f -path '*/EVB Viewer.app/Contents/MacOS/EVB Viewer' -print -quit)"
          test -n "$executable"
          pnpm run test:packaged-core-pdf-smoke -- --executable "$executable"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supplemental-mac-x64
          path: |
            release/*.zip
          if-no-files-found: error

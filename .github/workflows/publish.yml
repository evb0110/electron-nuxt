name: Publish Release
run-name: Publish Release (${{ inputs.tag }})

concurrency:
  group: publish-${{ github.workflow }}-${{ inputs.tag || github.run_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v1.2.3).
        required: true
        type: string
      preflight_run_id:
        description: Optional successful Release Preflight run id to reuse artifacts from.
        required: false
        type: string

permissions:
  actions: read
  contents: write

jobs:
  resolve:
    name: Resolve Certified Artifacts
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      target_sha: ${{ steps.sha.outputs.target_sha }}
      preflight_run_id: ${{ steps.preflight.outputs.run_id }}

    steps:
      - name: Resolve tag
        id: target
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"

          if [ -z "$TAG" ]; then
            echo "::error::A release tag is required."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout publish target
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.target.outputs.tag }}

      - name: Capture target sha
        id: sha
        shell: bash
        run: echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve reusable preflight artifacts
        id: preflight
        uses: actions/github-script@v7
        env:
          REQUESTED_RUN_ID: ${{ inputs.preflight_run_id }}
          TARGET_SHA: ${{ steps.sha.outputs.target_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requestedRunId = (process.env.REQUESTED_RUN_ID || '').trim();
            const targetSha = process.env.TARGET_SHA;
            const expectedWorkflowName = 'Release Preflight';
            const expectedWorkflowPath = '.github/workflows/release-preflight.yml';

            const ensureCertifiedPreflight = (run) => {
              const matchesWorkflowPath = run.path === expectedWorkflowPath;
              const matchesWorkflowName = run.name === expectedWorkflowName
                || run.name?.startsWith(`${expectedWorkflowName} (`);

              if (!matchesWorkflowPath || !matchesWorkflowName) {
                core.setFailed(
                  `Run ${run.id} is ${run.name} (${run.path}), not ${expectedWorkflowName} (${expectedWorkflowPath}).`,
                );
                return false;
              }

              if (run.event !== 'workflow_dispatch') {
                core.setFailed(`Preflight run ${run.id} was triggered by "${run.event}", expected workflow_dispatch.`);
                return false;
              }

              if (run.status !== 'completed') {
                core.setFailed(`Preflight run ${run.id} is still ${run.status}.`);
                return false;
              }

              if (run.conclusion !== 'success') {
                core.setFailed(`Preflight run ${run.id} completed with conclusion "${run.conclusion}".`);
                return false;
              }

              if (run.head_sha !== targetSha) {
                core.setFailed(
                  `Preflight run ${run.id} targets ${run.head_sha}, but publish target is ${targetSha}.`,
                );
                return false;
              }

              return true;
            };

            const useRun = async (runId) => {
              const numericRunId = Number(runId);
              if (!Number.isInteger(numericRunId)) {
                core.setFailed('preflight_run_id must be a numeric workflow run id.');
                return;
              }

              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: numericRunId,
              });

              if (!ensureCertifiedPreflight(run)) {
                return;
              }

              core.info(`Reusing artifacts from Release Preflight run ${run.id}.`);
              core.setOutput('run_id', String(run.id));
            };

            if (requestedRunId) {
              await useRun(requestedRunId);
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'release-preflight.yml',
              head_sha: targetSha,
              status: 'completed',
              per_page: 20,
            });

            const completedRuns = data.workflow_runs
              .filter((run) => run.head_sha === targetSha)
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));

            const latestRun = completedRuns[0];

            if (!latestRun) {
              core.setFailed(`No completed Release Preflight run found for ${targetSha}.`);
              return;
            }

            if (!ensureCertifiedPreflight(latestRun)) {
              return;
            }

            core.info(`Found certified preflight artifacts in latest run ${latestRun.id}.`);
            core.setOutput('run_id', String(latestRun.id));

  release:
    name: Create GitHub Release
    needs: resolve
    if: needs.resolve.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download certified release artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.resolve.outputs.preflight_run_id }}
          path: artifacts
          merge-multiple: true

      - name: Validate updater metadata paths
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          yml_files=(artifacts/latest*.yml)
          if [ ${#yml_files[@]} -eq 0 ]; then
            echo "::error::No latest*.yml files found in artifacts/"
            exit 1
          fi

          for yml in "${yml_files[@]}"; do
            rel_path="$(awk '/^path: / {print $2; exit}' "$yml" | tr -d '"' | tr -d "'")"
            if [ -z "$rel_path" ]; then
              echo "::error::Missing path entry in $yml"
              exit 1
            fi
            if [ ! -f "artifacts/$rel_path" ]; then
              echo "::error::Updater metadata mismatch in $yml -> $rel_path not found"
              echo "Available artifacts:"
              ls -la artifacts
              exit 1
            fi
          done

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.target_sha }}
          draft: false
          generate_release_notes: true
          files: artifacts/*

name: Supplemental Windows 7 Legacy Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit SHA to build.
        required: false
        type: string
    outputs:
      artifact_ready:
        description: Whether the legacy Windows 7 artifact was produced.
        value: ${{ jobs.build_win7_legacy.outputs.artifact_ready }}

permissions:
  contents: read

env:
  # Pin exact Node 24 patch level so supplemental release builds do not drift under tags.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LEGACY_ELECTRON_VERSION: 22.3.27

jobs:
  build_win7_legacy:
    name: build (windows-2022, win7 legacy, x64)
    runs-on: windows-2022
    outputs:
      artifact_ready: ${{ steps.artifact_status.outputs.ready }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Configure pnpm script shell
        shell: pwsh
        run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Cache Windows native tool archives
        # Optional accelerator only: the bundling script downloads on cache miss.
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/win-bundle-cache
          key: win7-legacy-native-tools-x64-${{ hashFiles('scripts/bundle-tools-windows.sh') }}

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: Bundle native tools (Windows)
        shell: bash
        env:
          WIN_BUNDLE_CACHE_DIR: ${{ runner.temp }}/win-bundle-cache
        run: TARGET_ARCH=x64 bash scripts/bundle-tools-windows.sh

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build (Nuxt + Electron)
        env:
          EVB_NATIVE_TARGET_ARCH: x64
          EVB_NATIVE_TARGET_PLATFORM: win
        run: pnpm run build:strict

      - name: Pin Electron 22 for Windows 7 packaging
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(path, 'utf8'));
          packageJson.devDependencies = packageJson.devDependencies || {};
          packageJson.devDependencies.electron = process.env.LEGACY_ELECTRON_VERSION;
          fs.writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          EOF

      - name: Install legacy Electron
        # Keep Nuxt and TypeScript builds on the locked dependency graph, then
        # swap Electron only for the optional Windows 7 packaging experiment.
        run: node scripts/ci-install-dependencies.mjs --no-frozen-lockfile

      - name: Verify legacy Electron install
        run: pnpm run check:electron:install

      - name: Package installer (Windows 7 legacy)
        id: package
        continue-on-error: true
        shell: bash
        run: |
          if ! bash scripts/release/run-with-retries.sh 3 20 "Windows 7 legacy packaging" \
            pnpm exec electron-builder --publish never --win --x64
          then
            echo "::notice::Windows 7 legacy packaging failed after 3 attempts; continuing without the optional legacy artifact"
            exit 1
          fi

      - name: Verify packaged native tools
        if: steps.package.outcome == 'success'
        shell: bash
        run: bash scripts/verify-packaged-native-tools.sh win x64

      - name: Verify packaged app contents
        if: steps.package.outcome == 'success'
        shell: bash
        run: node scripts/release/assert-packaged-app-contents.mjs

      - name: Verify packaged Windows 7 core PDF journey
        if: steps.package.outcome == 'success'
        shell: bash
        run: pnpm run test:packaged-core-pdf-smoke -- --executable "release/win-unpacked/EVB Viewer.exe"

      - name: Rename legacy artifacts
        if: steps.package.outcome == 'success'
        shell: bash
        run: |
          rm -f release/latest*.yml release/*.blockmap
          shopt -s nullglob
          for exe in release/*.exe; do
            mv "$exe" "${exe%.exe}-win7-legacy.exe"
          done

      - name: Record artifact status
        id: artifact_status
        shell: bash
        run: |
          shopt -s nullglob
          legacy_artifacts=(release/*win7-legacy*.exe)
          if [ "${{ steps.package.outcome }}" = "success" ] && [ ${#legacy_artifacts[@]} -gt 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Windows 7 legacy artifact was not produced; main release artifacts remain unaffected."
          fi

      - name: Upload artifacts
        if: steps.artifact_status.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legacy-win7-x64
          path: |
            release/*win7-legacy*.exe
          if-no-files-found: error

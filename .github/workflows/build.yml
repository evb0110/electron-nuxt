name: Release Build Matrix

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit SHA to build.
        required: false
        type: string

permissions:
  contents: read

env:
  # Pin exact Node 24 patch level so release builds do not drift under tags.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build (${{ matrix.os }}, ${{ matrix.platform }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (fast lane)
          - os: macos-14
            platform: mac
            arch: arm64

          # Linux — native runners for each arch
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64

          # Windows — both run on x64 runner; arm64 cross-bundles via MSYS2 clangarm64.
          # Pin to 2022 because the windows-2025 image currently exits during pnpm install.
          - os: windows-2022
            platform: win
            arch: x64
          - os: windows-2022
            platform: win
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Windows: pnpm postinstall uses Unix commands (mkdir -p, cp) that
      # require bash. Configure pnpm to use Git Bash for lifecycle scripts.
      - name: Configure pnpm script shell (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Cache Windows native tool archives
        if: runner.os == 'Windows'
        # Optional accelerator only: the bundling script downloads on cache miss.
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/win-bundle-cache
          key: win-native-tools-${{ matrix.arch }}-${{ hashFiles('scripts/bundle-tools-windows.sh') }}

      - name: Install dependencies
        # Fresh installs must leave Electron fully usable for later packaging.
        # The checked-in pnpm-workspace policy should make any drift fail here.
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      # macOS: install Homebrew tools and run all macOS bundle scripts
      - name: Bundle native tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract poppler qpdf djvulibre ffmpeg meson pkg-config sphinx-doc
          SPHINX_BIN="$(brew --prefix sphinx-doc)/bin"
          echo "$SPHINX_BIN" >> "$GITHUB_PATH"
          export PATH="$SPHINX_BIN:$PATH"
          bash scripts/bundle-tesseract-macos.sh
          bash scripts/bundle-leptonica-unpaper-macos.sh
          bash scripts/bundle-pdf-tools-macos.sh
          bash scripts/bundle-djvu-macos.sh

      # Linux: install via apt and bundle with patchelf
      - name: Bundle native tools (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: bash scripts/bundle-tools-linux.sh

      # Windows: x64 downloads pre-built release ZIPs; arm64 uses MSYS2 clangarm64
      - name: Bundle native tools (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_BUNDLE_CACHE_DIR: ${{ runner.temp }}/win-bundle-cache
        run: TARGET_ARCH=${{ matrix.arch }} bash scripts/bundle-tools-windows.sh

      - name: Install Rust target (Windows arm64)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build (Nuxt + Electron)
        env:
          EVB_NATIVE_TARGET_ARCH: ${{ matrix.arch }}
          EVB_NATIVE_TARGET_PLATFORM: ${{ matrix.platform }}
        run: pnpm run build:strict

      - name: Upload strict build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.platform }}-${{ matrix.arch }}
          path: .tmp/build.log
          if-no-files-found: ignore

      - name: Configure optional macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/release/configure-macos-signing.sh

      - name: Package installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${MAC_CSC_LINK:-}" ] && [ -n "${MAC_CSC_KEY_PASSWORD:-}" ]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          else
            unset CSC_LINK CSC_KEY_PASSWORD
          fi

          if [ -n "${APPLE_API_KEY_PATH:-}" ] && [ -n "${APPLE_API_KEY_ID_ENV:-}" ] && [ -n "${APPLE_API_ISSUER_ENV:-}" ]; then
            export APPLE_API_KEY="$APPLE_API_KEY_PATH"
            export APPLE_API_KEY_ID="$APPLE_API_KEY_ID_ENV"
            export APPLE_API_ISSUER="$APPLE_API_ISSUER_ENV"
          else
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi

          bash scripts/release/run-with-retries.sh 3 20 "macOS packaging" \
            pnpm exec electron-builder --publish never --mac --${{ matrix.arch }}

      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_EXPECT_DEVELOPER_ID: ${{ env.MAC_EXPECT_DEVELOPER_ID }}
        run: bash scripts/release/verify-macos-signature.sh

      # electron-builder v25 downloads fpm at build time, which is unreliable
      # (x86-only binary on arm64, download failures on x64). Install system fpm.
      - name: Install system fpm (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-dev build-essential
          sudo gem install fpm

      # pnpm may lose exec permission on the app-builder binary (pnpm/pnpm#8546)
      - name: Fix app-builder-bin permissions (Linux arm64)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          APP_BUILDER="$(find node_modules -path '*/app-builder-bin/linux/arm64/app-builder' -type f 2>/dev/null | head -1)"
          if [ -n "$APP_BUILDER" ]; then
            chmod +x "$APP_BUILDER"
            echo "Fixed permissions: $APP_BUILDER"
          else
            echo "::notice::app-builder binary not found; skipping explicit chmod workaround"
          fi

      - name: Package installer (Linux)
        if: runner.os == 'Linux'
        env:
          USE_SYSTEM_FPM: "true"
        run: pnpm exec electron-builder --publish never --linux --${{ matrix.arch }}

      - name: Configure optional Windows signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          echo "WIN_CSC_LINK_ENV=" >> "$GITHUB_ENV"
          echo "WIN_CSC_KEY_PASSWORD_ENV=" >> "$GITHUB_ENV"
          echo "WIN_EXPECT_SIGNATURE=false" >> "$GITHUB_ENV"

          if [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "WIN_CSC_LINK_ENV=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD_ENV=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "WIN_EXPECT_SIGNATURE=true" >> "$GITHUB_ENV"
          elif [ -n "$WIN_CSC_LINK" ] || [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "::warning::Partial WIN_CSC_* secrets detected; building unsigned Windows installer"
          else
            echo "::notice::No Windows signing certificate configured; building unsigned Windows installer"
          fi

      - name: Package installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -n "${WIN_CSC_LINK_ENV:-}" ] && [ -n "${WIN_CSC_KEY_PASSWORD_ENV:-}" ]; then
            export WIN_CSC_LINK="$WIN_CSC_LINK_ENV"
            export WIN_CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD_ENV"
          else
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi

          bash scripts/release/run-with-retries.sh 3 20 "Windows packaging" \
            pnpm exec electron-builder --publish never --win --${{ matrix.arch }}

      - name: Verify Windows signature
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_EXPECT_SIGNATURE: ${{ env.WIN_EXPECT_SIGNATURE }}
        run: |
          $executables = Get-ChildItem -Path release -Filter *.exe
          if (-not $executables) {
            Write-Error "No .exe artifact found in release/"
            exit 1
          }

          foreach ($exe in $executables) {
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            Write-Host "Installer: $($exe.Name)"
            Write-Host "Authenticode status: $($sig.Status)"

            if ($env:WIN_EXPECT_SIGNATURE -eq "true" -and $sig.Status -ne "Valid") {
              Write-Error "Windows installer is not validly signed"
              exit 1
            }
          }

      - name: Verify packaged native tools
        shell: bash
        run: bash scripts/verify-packaged-native-tools.sh "${{ matrix.platform }}" "${{ matrix.arch }}"

      - name: Verify packaged app contents
        shell: bash
        run: node scripts/release/assert-packaged-app-contents.mjs

      - name: Verify packaged startup
        if: runner.os == 'macOS'
        shell: bash
        # Only macOS has packaged startup verification right now; Linux/Windows
        # still rely on smoke coverage plus host-specific checks.
        run: bash scripts/verify-packaged-startup.sh "${{ matrix.platform }}" "${{ matrix.arch }}"

      - name: Prune updater metadata on unsupported updater targets
        if: |
          runner.os == 'Linux'
          || (runner.os == 'Windows' && (matrix.arch != 'x64' || env.WIN_EXPECT_SIGNATURE != 'true'))
          || (runner.os == 'macOS' && env.MAC_EXPECT_DEVELOPER_ID != 'true')
        shell: bash
        run: |
          # Unsigned mac builds still launch when installed fresh, but publishing
          # latest-mac.yml + blockmaps lets signed installs reconstruct an update
          # from mixed-signature blocks. Keep ad-hoc mac artifacts manual-only.
          #
          # Unsigned Windows installers also stay publishable, but updater feeds
          # are reserved for signed x64 builds so release behavior stays
          # deterministic across platforms and install paths.
          rm -f release/latest*.yml
          rm -f release/*.blockmap

      - name: Verify release artifacts
        shell: bash
        env:
          EVB_RELEASE_HAS_MAC_SIGNING: ${{ env.MAC_EXPECT_DEVELOPER_ID }}
          EVB_RELEASE_HAS_WINDOWS_SIGNING: ${{ env.WIN_EXPECT_SIGNATURE }}
        run: node scripts/release/assert-build-artifacts.mjs release "${{ matrix.platform }}" "${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

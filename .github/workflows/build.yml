name: Core Release Build Matrix

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit SHA to build.
        required: false
        type: string
      release_environment:
        description: Environment used only for signed public-release builds.
        required: false
        default: artifact-build
        type: string
      sentry_environment:
        description: Closed Sentry build environment for this artifact.
        required: false
        default: test
        type: string
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }}, ${{ matrix.platform }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
            artifact_group: dist-mac-arm64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            artifact_group: dist-linux-x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact_group: dist-linux-arm64
          # Pin x64 to 2022 because the windows-2025 image currently exits
          # during pnpm install.
          - os: windows-2022
            platform: win
            arch: x64
            artifact_group: dist-win-x64
    uses: ./.github/workflows/build-target.yml
    with:
      ref: ${{ inputs.ref }}
      release_environment: ${{ inputs.release_environment }}
      sentry_environment: ${{ inputs.sentry_environment }}
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      artifact_group: ${{ matrix.artifact_group }}
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

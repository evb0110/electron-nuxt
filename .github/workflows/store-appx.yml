name: Microsoft Store Package

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit SHA to package.
        required: false
        type: string
      submit:
        description: Submit the built AppX packages to Partner Center when Store API secrets are present.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit SHA to package. Defaults to the selected branch.
        required: false
        type: string
      submit:
        description: Submit the built AppX packages to Partner Center when Store API secrets are present.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Match the release build matrix so Store packages are built with the same
  # runtime as direct-download Windows installers.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STORE_PRODUCT_ID: '9N3MB1WJGX1L'

jobs:
  build:
    name: appx (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Windows: pnpm postinstall uses Unix commands (mkdir -p, cp) that
      # require bash. Configure pnpm to use Git Bash for lifecycle scripts.
      - name: Configure pnpm script shell
        shell: pwsh
        run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Cache Windows native tool archives
        # Optional accelerator only: the bundling script downloads on cache miss.
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/win-bundle-cache
          key: store-win-native-tools-${{ matrix.arch }}-${{ hashFiles('scripts/bundle-tools-windows.sh') }}

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Verify Electron install
        run: pnpm run check:electron:install

      - name: Bundle native tools
        shell: bash
        env:
          WIN_BUNDLE_CACHE_DIR: ${{ runner.temp }}/win-bundle-cache
        run: TARGET_ARCH=${{ matrix.arch }} bash scripts/bundle-tools-windows.sh

      - name: Install Rust target (arm64)
        if: matrix.arch == 'arm64'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build (Nuxt + Electron)
        env:
          EVB_NATIVE_TARGET_ARCH: ${{ matrix.arch }}
          EVB_NATIVE_TARGET_PLATFORM: win
        run: pnpm run build:strict

      - name: Upload strict build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: store-build-log-win-${{ matrix.arch }}
          path: .tmp/build.log
          if-no-files-found: ignore

      - name: Package Microsoft Store AppX
        shell: bash
        run: |
          bash scripts/release/run-with-retries.sh 3 20 "Microsoft Store AppX packaging" \
            pnpm exec electron-builder --publish never --win appx --${{ matrix.arch }}

      - name: Verify Microsoft Store AppX
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path release -Filter "*-store.appx")
          if ($packages.Count -ne 1) {
            Write-Error "Expected exactly one Store .appx package, found $($packages.Count)."
            exit 1
          }

          $extractDir = Join-Path "${{ github.workspace }}" ".tmp\store-appx-${{ matrix.arch }}"
          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          # AppX is an OPC package: reserved characters such as '+' are
          # percent-encoded in raw ZIP entry names. MakeAppx decodes those
          # package URIs while unpacking, matching the filenames exposed to the
          # installed application and Windows DLL loader. tar.exe leaves the
          # encoded names on disk and produces false missing-DLL failures for
          # libc++.dll and libstdc++-6.dll.
          $makeAppxPath = (Get-Command makeappx.exe -ErrorAction SilentlyContinue).Source
          if (-not $makeAppxPath) {
            $sdkBinRoot = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
            $makeAppxPath = Get-ChildItem -Path $sdkBinRoot -Filter makeappx.exe -File -Recurse -ErrorAction Stop |
              Where-Object { $_.FullName -match '[\\/]x64[\\/]makeappx\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $makeAppxPath) {
            Write-Error "MakeAppx is not installed or discoverable in the Windows SDK."
            exit 1
          }
          & $makeAppxPath unpack /o /p $packages[0].FullName /d $extractDir
          if ($LASTEXITCODE -ne 0) {
            Write-Error "MakeAppx failed to unpack the Store package."
            exit $LASTEXITCODE
          }

          $manifestPath = Join-Path $extractDir "AppxManifest.xml"
          if (-not (Test-Path $manifestPath)) {
            Write-Error "AppxManifest.xml is missing from the Store package."
            exit 1
          }

          $manifest = Get-Content -Raw $manifestPath
          $expectedManifestSnippets = @(
            'Name="EugeneBarsky.EVBViewer"',
            "Publisher='CN=06251AF5-66AF-420F-B896-574B507600B9'",
            '<DisplayName>EVB Viewer</DisplayName>',
            '<PublisherDisplayName>Eugene Barsky</PublisherDisplayName>',
            'Id="EVBViewer"',
            'Executable="app\EVB Viewer.exe"',
            'EntryPoint="Windows.FullTrustApplication"',
            'Name="runFullTrust"',
            '<Resource Language="en-US" />',
            '<Resource Language="ru-RU" />',
            '<Resource Language="fr-FR" />',
            '<Resource Language="de-DE" />',
            '<Resource Language="es-ES" />',
            '<Resource Language="it-IT" />',
            '<Resource Language="pt-PT" />',
            '<Resource Language="pt-BR" />',
            '<Resource Language="nl-NL" />'
          )

          foreach ($snippet in $expectedManifestSnippets) {
            if (-not $manifest.Contains($snippet)) {
              Write-Error "AppX manifest is missing expected snippet: $snippet"
              exit 1
            }
          }

          $expectedAssets = @(
            "StoreLogo.png",
            "Square44x44Logo.png",
            "Square150x150Logo.png",
            "Wide310x150Logo.png",
            "SmallTile.png",
            "LargeTile.png",
            "SplashScreen.png"
          )

          foreach ($asset in $expectedAssets) {
            $assetPath = Join-Path $extractDir "assets\$asset"
            if (-not (Test-Path $assetPath)) {
              Write-Error "Store package is missing asset: $asset"
              exit 1
            }
          }

          Write-Host "Verified Store package: $($packages[0].Name)"

      - name: Verify packaged native tools in Microsoft Store AppX
        shell: bash
        run: bash scripts/verify-packaged-native-tools.sh win "${{ matrix.arch }}" ".tmp/store-appx-${{ matrix.arch }}"

      - name: Verify packaged app contents in Microsoft Store AppX
        shell: bash
        run: node scripts/release/assert-packaged-app-contents.mjs ".tmp/store-appx-${{ matrix.arch }}"

      - name: Record Microsoft Store packaged-app provenance
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release/build-provenance.mjs create store "${{ matrix.arch }}" \
            ".tmp/store-appx-${{ matrix.arch }}/app/resources/app.asar" \
            "release/EVB-Viewer-${version}-store-${{ matrix.arch }}-provenance.json"

      - name: Upload Microsoft Store AppX
        uses: actions/upload-artifact@v7
        with:
          name: store-appx-win-${{ matrix.arch }}
          path: |
            release/*-store.appx
            release/*-store-*-provenance.json
          if-no-files-found: error

  submit:
    name: submit to Microsoft Store
    needs: build
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download Microsoft Store AppX artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: store-appx-win-*
          path: store-artifacts
          merge-multiple: true

      - name: Configure optional Store submission
        id: store_submission
        shell: bash
        env:
          STORE_SUBMIT_REQUESTED: ${{ inputs.submit }}
          PARTNER_TENANT_ID: ${{ secrets.PARTNER_TENANT_ID }}
          PARTNER_CLIENT_ID: ${{ secrets.PARTNER_CLIENT_ID }}
          PARTNER_CLIENT_SECRET: ${{ secrets.PARTNER_CLIENT_SECRET }}
        run: |
          echo "ready=false" >> "$GITHUB_OUTPUT"

          if [ "$STORE_SUBMIT_REQUESTED" != "true" ]; then
            echo "::notice::Microsoft Store submission was not requested; AppX artifacts were built only."
            exit 0
          fi

          missing=()
          [ -n "$PARTNER_TENANT_ID" ] || missing+=("PARTNER_TENANT_ID")
          [ -n "$PARTNER_CLIENT_ID" ] || missing+=("PARTNER_CLIENT_ID")
          [ -n "$PARTNER_CLIENT_SECRET" ] || missing+=("PARTNER_CLIENT_SECRET")

          if [ "${#missing[@]}" -eq 3 ]; then
            echo "::notice::Microsoft Store submission secrets are not configured; AppX artifacts were built only."
            exit 0
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Partial Microsoft Store submission secrets detected; missing: ${missing[*]}"
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Compare GitHub and Microsoft Store packaged-app provenance
        if: steps.store_submission.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir direct-provenance
          for arch in x64 arm64; do
            direct="EVB-Viewer-${version}-win-${arch}-provenance.json"
            store="store-artifacts/EVB-Viewer-${version}-store-${arch}-provenance.json"
            gh release download "v${version}" --pattern "$direct" --dir direct-provenance
            node scripts/release/build-provenance.mjs assert-match "direct-provenance/$direct" "$store"
          done

      - name: Submit Microsoft Store AppX packages
        if: steps.store_submission.outputs.ready == 'true'
        shell: pwsh
        env:
          PARTNER_TENANT_ID: ${{ secrets.PARTNER_TENANT_ID }}
          PARTNER_CLIENT_ID: ${{ secrets.PARTNER_CLIENT_ID }}
          PARTNER_CLIENT_SECRET: ${{ secrets.PARTNER_CLIENT_SECRET }}
        run: |
          .\scripts\release\submit-store-appx.ps1 `
            -TenantId $env:PARTNER_TENANT_ID `
            -ClientId $env:PARTNER_CLIENT_ID `
            -ClientSecret $env:PARTNER_CLIENT_SECRET `
            -ProductId $env:STORE_PRODUCT_ID `
            -AppPackagesDirectory "${{ github.workspace }}\store-artifacts"

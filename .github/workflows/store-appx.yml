name: Microsoft Store Package

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit SHA to package.
        required: false
        type: string
permissions:
  contents: read

env:
  # Match the release build matrix so Store packages are built with the same
  # runtime as direct-download Windows installers.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STORE_PRODUCT_ID: '9N3MB1WJGX1L'

jobs:
  build:
    name: appx (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          windows-bundle-cache-key: store-win-native-tools-${{ matrix.arch }}
          rust-targets: ${{ matrix.arch == 'arm64' && 'wasm32-unknown-unknown aarch64-pc-windows-msvc' || 'wasm32-unknown-unknown' }}

      - name: Bundle native tools
        shell: bash
        env:
          WIN_BUNDLE_CACHE_DIR: ${{ runner.temp }}/win-bundle-cache
        run: TARGET_ARCH=${{ matrix.arch }} bash scripts/bundle-tools-windows.sh

      - name: Build (Nuxt + Electron)
        env:
          EVB_NATIVE_TARGET_ARCH: ${{ matrix.arch }}
          EVB_NATIVE_TARGET_PLATFORM: win
        run: pnpm run build:strict

      - name: Upload strict build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-build-log-win-${{ matrix.arch }}-${{ github.run_attempt }}
          path: .tmp/build.log
          if-no-files-found: ignore

      - name: Package Microsoft Store AppX
        shell: bash
        run: |
          bash scripts/release/run-with-retries.sh 3 20 "Microsoft Store AppX packaging" \
            pnpm exec electron-builder --publish never --win appx --${{ matrix.arch }}

      - name: Verify Microsoft Store AppX
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path release -Filter "*-store.appx")
          if ($packages.Count -ne 1) {
            Write-Error "Expected exactly one Store .appx package, found $($packages.Count)."
            exit 1
          }

          $extractDir = Join-Path "${{ github.workspace }}" ".tmp\store-appx-${{ matrix.arch }}"
          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          # AppX is an OPC package: reserved characters such as '+' are
          # percent-encoded in raw ZIP entry names. MakeAppx decodes those
          # package URIs while unpacking, matching the filenames exposed to the
          # installed application and Windows DLL loader. tar.exe leaves the
          # encoded names on disk and produces false missing-DLL failures for
          # libc++.dll and libstdc++-6.dll.
          $makeAppxPath = (Get-Command makeappx.exe -ErrorAction SilentlyContinue).Source
          if (-not $makeAppxPath) {
            $sdkBinRoot = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
            $makeAppxPath = Get-ChildItem -Path $sdkBinRoot -Filter makeappx.exe -File -Recurse -ErrorAction Stop |
              Where-Object { $_.FullName -match '[\\/]x64[\\/]makeappx\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $makeAppxPath) {
            Write-Error "MakeAppx is not installed or discoverable in the Windows SDK."
            exit 1
          }
          & $makeAppxPath unpack /o /p $packages[0].FullName /d $extractDir
          if ($LASTEXITCODE -ne 0) {
            Write-Error "MakeAppx failed to unpack the Store package."
            exit $LASTEXITCODE
          }

          $manifestPath = Join-Path $extractDir "AppxManifest.xml"
          if (-not (Test-Path $manifestPath)) {
            Write-Error "AppxManifest.xml is missing from the Store package."
            exit 1
          }

          $manifest = Get-Content -Raw $manifestPath
          $expectedManifestSnippets = @(
            'Name="EugeneBarsky.EVBViewer"',
            "Publisher='CN=06251AF5-66AF-420F-B896-574B507600B9'",
            '<DisplayName>EVB Viewer</DisplayName>',
            '<PublisherDisplayName>Eugene Barsky</PublisherDisplayName>',
            'Id="EVBViewer"',
            'Executable="app\EVB Viewer.exe"',
            'EntryPoint="Windows.FullTrustApplication"',
            'Name="runFullTrust"',
            '<Resource Language="en-US" />',
            '<Resource Language="ru-RU" />',
            '<Resource Language="fr-FR" />',
            '<Resource Language="de-DE" />',
            '<Resource Language="es-ES" />',
            '<Resource Language="it-IT" />',
            '<Resource Language="pt-PT" />',
            '<Resource Language="pt-BR" />',
            '<Resource Language="nl-NL" />'
          )

          foreach ($snippet in $expectedManifestSnippets) {
            if (-not $manifest.Contains($snippet)) {
              Write-Error "AppX manifest is missing expected snippet: $snippet"
              exit 1
            }
          }

          $expectedAssets = @(
            "StoreLogo.png",
            "Square44x44Logo.png",
            "Square150x150Logo.png",
            "Wide310x150Logo.png",
            "SmallTile.png",
            "LargeTile.png",
            "SplashScreen.png"
          )

          foreach ($asset in $expectedAssets) {
            $assetPath = Join-Path $extractDir "assets\$asset"
            if (-not (Test-Path $assetPath)) {
              Write-Error "Store package is missing asset: $asset"
              exit 1
            }
          }

          Write-Host "Verified Store package: $($packages[0].Name)"

      - name: Install and launch Microsoft Store AppX smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packagePath = (Get-ChildItem -Path release -Filter "*-store.appx" | Select-Object -First 1).FullName
          $installedPackage = Add-AppxPackage -Path $packagePath -ForceApplicationShutdown -PassThru
          try {
            $package = Get-AppxPackage -Name 'EugeneBarsky.EVBViewer' -ErrorAction Stop
            $installedExecutable = Join-Path $package.InstallLocation 'app\EVB Viewer.exe'
            if (-not (Test-Path $installedExecutable -PathType Leaf)) {
              throw "Installed Store package executable is missing: $installedExecutable"
            }

            $appUserModelId = "$($package.Name)!EVBViewer"
            $launcher = Start-Process -FilePath "shell:AppsFolder\$appUserModelId" -PassThru
            $launchDeadline = (Get-Date).AddMinutes(2)
            $launchedProcess = $null
            while (-not $launchedProcess -and (Get-Date) -lt $launchDeadline) {
              Start-Sleep -Seconds 2
              $launchedProcess = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object { $_.ExecutablePath -eq $installedExecutable } |
                Select-Object -First 1
            }
            if (-not $launchedProcess) {
              throw "Store AppX launch did not start $installedExecutable before the deadline."
            }
            Stop-Process -Id $launchedProcess.ProcessId -Force -ErrorAction SilentlyContinue
            pnpm run test:packaged-core-pdf-smoke -- --executable $installedExecutable
            if ($LASTEXITCODE -ne 0) {
              throw "Installed Store AppX core-PDF smoke failed with exit code $LASTEXITCODE."
            }
          } finally {
            if ($installedPackage -and $installedPackage.PackageFullName) {
              Remove-AppxPackage -Package $installedPackage.PackageFullName -ErrorAction Stop
            } else {
              $installed = Get-AppxPackage -Name 'EugeneBarsky.EVBViewer' -ErrorAction SilentlyContinue
              if ($installed) {
                Remove-AppxPackage -Package $installed.PackageFullName -ErrorAction Stop
              }
            }
          }

      - name: Verify packaged native tools in Microsoft Store AppX
        shell: bash
        run: bash scripts/verify-packaged-native-tools.sh win "${{ matrix.arch }}" ".tmp/store-appx-${{ matrix.arch }}"

      - name: Verify packaged app contents in Microsoft Store AppX
        shell: bash
        run: node scripts/release/assert-packaged-app-contents.mjs ".tmp/store-appx-${{ matrix.arch }}"

      - name: Record Microsoft Store packaged-app provenance
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release/build-provenance.mjs create store "${{ matrix.arch }}" \
            ".tmp/store-appx-${{ matrix.arch }}/app/resources/app.asar" \
            "release/EVB-Viewer-${version}-store-${{ matrix.arch }}-provenance.json"

      - name: Upload Microsoft Store AppX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-appx-win-${{ matrix.arch }}
          path: |
            release/*-store.appx
            release/*-store-*-provenance.json
          if-no-files-found: error

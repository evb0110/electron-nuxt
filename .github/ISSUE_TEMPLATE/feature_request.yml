name: Feature request
description: Suggest an improvement to EVB Viewer.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would make the workflow better?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Desktop app
        - Browser workspace
        - Landing site
        - Build or packaging
        - Not sure
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, sample files, or comparable tools.

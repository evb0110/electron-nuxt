appId: com.evb.viewer
productName: EVB Viewer
copyright: Copyright © 2026 Eugene Barsky

# Keep the built Nuxt renderer as static assets. Electron backend behavior lives
# in main/preload plus typed IPC; packaged apps do not ship or spawn Nitro.
# Main, preload, and all workers are fully esbuild-bundled
# (scripts/build-electron.mjs), so the package ships no node_modules at all.
# Worker entry files that require direct filesystem paths are unpacked, together
# with the pdfjs fallback worker they dynamically import and the package.json
# that pins dist-electron/*.js to ESM semantics.
asar: true
asarUnpack:
  - dist-electron/package.json
  - dist-electron/djvu-pdfWorker.js
  - dist-electron/image-export-tiff-worker.js
  - dist-electron/ocr-worker.js
  - dist-electron/page-ops-cropWorker.js
  - dist-electron/pdf.worker.mjs
  - dist-electron/pdfCombineWorker.js
  - dist-electron/pdfConformanceWorker.js
  - dist-electron/search-worker.js
npmRebuild: false
afterPack: ./scripts/afterPack.cjs
afterSign: ./scripts/afterSign.cjs

directories:
  # Keep desktop release artifacts out of top-level dist/ so Vercel does not
  # mistake Electron packages for web output.
  output: release

files:
  - dist-electron/
  - nuxt-output/public/
  - package.json
  # Runtime needs nothing from node_modules (electron-updater is bundled into
  # main.cjs); production dependencies exist for the web/Nitro target only.
  - "!**/node_modules/**"
  - "!nuxt-output/**/*.map"
  - "!dist-electron/**/*.map"
  # Web-only marketing/SEO surface — unreachable from the desktop shell.
  - "!nuxt-output/public/evb-viewer-seo.png"
  - "!nuxt-output/public/evb-viewer-preview-cropped.png"
  - "!nuxt-output/public/evb-viewer-og.png"
  - "!nuxt-output/public/mobile-reader-proof/**"
  - "!nuxt-output/public/robots.txt"
  - "!nuxt-output/public/sitemap.xml"
  - "!.devkit/**/*"
  - "!.devkit"

extraResources:
  - from: resources/tesseract/tessdata
    to: tesseract/tessdata
  - from: resources/icon.png
    to: icon.png

mac:
  icon: resources/icon.icns
  artifactName: "EVB-Viewer-${version}-${arch}.${ext}"
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  # Native tools are staged via extraResources, then afterPack moves the
  # executable payloads under Contents/MacOS/native-tools. macOS kills Mach-O
  # launches from Contents/Resources inside .app bundles on current hosts.
  # afterSign re-signs the moved payloads with the app identity so bundled
  # dylibs loaded by those executables pass library validation.
  extraResources:
    - from: resources/tesseract/darwin-${arch}
      to: tesseract/darwin-${arch}
    - from: resources/poppler/darwin-${arch}
      to: poppler/darwin-${arch}
    - from: resources/qpdf/darwin-${arch}
      to: qpdf/darwin-${arch}
    - from: resources/djvulibre/darwin-${arch}
      to: djvulibre/darwin-${arch}
    - from: .tmp/pdf-image-combine/darwin-${arch}
      to: pdf-image-combine/darwin-${arch}
    - from: .tmp/pdf-page-ops/darwin-${arch}
      to: pdf-page-ops/darwin-${arch}
    - from: .tmp/pdf-search/darwin-${arch}
      to: pdf-search/darwin-${arch}

win:
  icon: resources/icon.ico
  artifactName: "EVB-Viewer-${version}-${arch}-setup.${ext}"
  target:
    - nsis
  extraResources:
    - from: resources/tesseract/win32-${arch}
      to: tesseract/win32-${arch}
    - from: resources/poppler/win32-${arch}
      to: poppler/win32-${arch}
      filter:
        - "**/*"
        - "!share/poppler/CMakeLists.txt"
        - "!share/poppler/Makefile"
        - "!share/poppler/README"
        - "!share/poppler/poppler-data.pc"
        - "!share/poppler/poppler-data.pc.in"
    - from: resources/qpdf/win32-${arch}
      to: qpdf/win32-${arch}
    - from: resources/djvulibre/win32-${arch}
      to: djvulibre/win32-${arch}
    - from: .tmp/pdf-image-combine/win32-${arch}
      to: pdf-image-combine/win32-${arch}
    - from: .tmp/pdf-page-ops/win32-${arch}
      to: pdf-page-ops/win32-${arch}
    - from: .tmp/pdf-search/win32-${arch}
      to: pdf-search/win32-${arch}

linux:
  icon: resources/icon.png
  maintainer: Eugene Barsky <34789976+evb0110@users.noreply.github.com>
  vendor: Eugene Barsky
  synopsis: PDF and DjVu document viewer
  description: EVB Viewer is a desktop document viewer for PDF and DjVu files with OCR, annotations, page operations, export tools, and multi-tab viewing.
  category: Office
  desktop:
    entry:
      Keywords: PDF;DjVu;Document;Viewer;OCR;
      X-AppStream-DeveloperName: Eugene Barsky
  target:
    - AppImage
    - deb
  extraResources:
    - from: resources/tesseract/linux-${arch}
      to: tesseract/linux-${arch}
    - from: resources/poppler/linux-${arch}
      to: poppler/linux-${arch}
    - from: resources/qpdf/linux-${arch}
      to: qpdf/linux-${arch}
    - from: resources/djvulibre/linux-${arch}
      to: djvulibre/linux-${arch}
    - from: .tmp/pdf-image-combine/linux-${arch}
      to: pdf-image-combine/linux-${arch}
    - from: .tmp/pdf-page-ops/linux-${arch}
      to: pdf-page-ops/linux-${arch}
    - from: .tmp/pdf-search/linux-${arch}
      to: pdf-search/linux-${arch}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  include: build/installer.nsh

fileAssociations:
  - ext: pdf
    mimeType: application/pdf
    role: Viewer
  - ext: djvu
    mimeType: image/vnd.djvu
    role: Viewer
  - ext: djv
    mimeType: image/vnd.djvu
    role: Viewer

dmg:
  backgroundColor: "#D9DDE5"
  icon: null
  iconSize: 128
  window:
    width: 600
    height: 450
  contents:
    - x: 160
      y: 185
    - x: 440
      y: 185
      type: link
      path: /Applications

publish:
  provider: github
  owner: evb0110
  repo: evb-viewer

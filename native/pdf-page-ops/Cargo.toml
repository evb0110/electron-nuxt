[package]
name = "evb-pdf-page-ops"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
getrandom = "0.4.2"
evb-native-support = { version = "0.1.0", path = "../evb-native-support" }
lopdf = { version = "0.44.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[package]
name = "evb-pdf-image-combine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
evb-native-support = { path = "../evb-native-support" }
crc32fast = "1.5.0"
fax = "0.2.7"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
jpeg-encoder = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiff = "0.11.3"

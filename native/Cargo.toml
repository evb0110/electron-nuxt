[workspace]
members = [
    "evb-native-support",
    "pdf-image-combine",
    "pdf-page-ops",
    "pdf-search",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"
